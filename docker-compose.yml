services:
  postgres:
    profiles: ["full"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scraper
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d scraper"]
      interval: 5s
      retries: 5
      timeout: 5s
    # O3: 256m was the direct cause of the OOM kills (2×/36h on prod —
    # postgres 16 default shared_buffers alone is 128m; langgraph
    # checkpoints write full state blobs + SessionLog-heavy workloads).
    # restart: it previously had none, so an OOM left it dead for good.
    mem_limit: 1g
    restart: unless-stopped

  redis:
    profiles: ["full"]
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
      timeout: 5s
    mem_limit: 64m

  django:
    profiles: ["full"]
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin} python manage.py createsuperuser --noinput --username admin --email admin@example.com 2>/dev/null || true &&
             python manage.py runserver 0.0.0.0:8000 --noreload"
    volumes:
      - .:/app
    environment:
      DB_HOST: postgres
      DB_NAME: scraper
      DB_USER: scraper
      DB_PASSWORD: scraper-password
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-https://api.z.ai/api/coding/paas/v4/}
      ZAI_MAIN_MODEL: ${ZAI_MAIN_MODEL:-glm-5-turbo}
      ZAI_SMALL_MODEL: ${ZAI_SMALL_MODEL:-glm-5-turbo}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
      PLAYWRIGHT_MCP_URL: http://browser_service:8111/sse
      BROWSER_SERVICE_URL: http://browser_service:8001
      FILE_MASTER_URL: http://file-master:8002
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: dev-secret-key-change-in-production
      PYTHONPATH: /app
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 60s
    restart: unless-stopped
    mem_limit: 1g

  celery-worker:
    profiles: ["full"]
    build: .
    init: true
    command: celery -A config worker -l INFO --loglevel=INFO --concurrency=2 -Ofair
    volumes:
      - .:/app
    environment:
      DB_HOST: postgres
      DB_NAME: scraper
      DB_USER: scraper
      DB_PASSWORD: scraper-password
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-https://api.z.ai/api/coding/paas/v4/}
      ZAI_MAIN_MODEL: ${ZAI_MAIN_MODEL:-glm-5-turbo}
      ZAI_SMALL_MODEL: ${ZAI_SMALL_MODEL:-glm-5-turbo}
      # T0.1 model confound: code_writer is the ONLY per-agent model override.
      # compose no longer forces a default (glm-5.2) — unset here means the
      # settings.py default (glm-5-turbo, the 204-job corpus model) applies, so
      # runs stay comparable. Set CODE_WRITER_MODEL explicitly in .env to deviate.
      CODE_WRITER_MODEL: ${CODE_WRITER_MODEL:-}
      # LiteLLM proxy routing (llm.py _provider_for): set CODE_WRITER_MODEL=
      # litellm/standardcompute to route code_writer through the proxy. The
      # prefix is the kill switch — unset it to return to Z.AI.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://llm.johnjf.xyz/v1}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_ENABLED: ${LITELLM_ENABLED:-true}
      # [wave-15 PR-2b] Per-phase async invoke canary (default OFF — empty
      # allowlist, every phase runs sync). Opt a phase in for a canary run:
      # AGENT_ASYNC_PHASES=code_writer. The old all-phases switch
      # (LLM_ASYNC_EXECUTION) no longer flows through compose — it stays in
      # settings.py as an operator-only rollback lever.
      AGENT_ASYNC_PHASES: ${AGENT_ASYNC_PHASES:-}
      PLAYWRIGHT_MCP_URL: http://browser_service:8111/sse
      BROWSER_SERVICE_URL: http://browser_service:8001
      FILE_MASTER_URL: http://file-master:8002
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: dev-secret-key-change-in-production
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser_service:
        condition: service_healthy
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      retries: 3
      timeout: 20s
      start_period: 120s
    mem_limit: 3g
    memswap_limit: 4g

  celery-events:
    # Fold B5: partner-event delivery must never share the scrape pool —
    # one hung partner endpoint ≈ 10 min of zero scrape capacity otherwise.
    # Runs migrate first (beat may enqueue before worker start on Railway's
    # parallel startup — a worker without tables crash-loops into invisible
    # Redis buildup).
    profiles: ["full"]
    build: .
    init: true
    command: >
      sh -c "python manage.py migrate --noinput &&
             celery -A config worker -l INFO -Q events -Ofair --concurrency=4"
    volumes:
      - .:/app
    environment:
      DB_HOST: postgres
      DB_NAME: scraper
      DB_USER: scraper
      DB_PASSWORD: scraper-password
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: dev-secret-key-change-in-production
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      retries: 3
      timeout: 20s
      start_period: 90s
    mem_limit: 512m
    restart: unless-stopped

  event-gateway:
    # Phase 2 WSS gateway (async_api.yaml /ws/v1/jobs). Standalone FastAPI
    # service — the Django tier stays WSGI. Owns the websocket surface only:
    # auth parity via read-only SQL, control protocol, envelope fan-out,
    # <=25s app heartbeats.
    profiles: ["full"]
    build:
      context: .
      dockerfile: event_gateway/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_HOST: postgres
      DB_NAME: scraper
      DB_USER: scraper
      DB_PASSWORD: scraper-password
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: dev-secret-key-change-in-production
      PYTHONPATH: /app:/app/webapp
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8100/health"]
      interval: 15s
      retries: 3
      timeout: 5s
    restart: unless-stopped
    mem_limit: 256m

  celery-beat:
    profiles: ["full"]
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             celery -A config beat -l INFO --loglevel=INFO"
    volumes:
      - .:/app
    environment:
      DB_HOST: postgres
      DB_NAME: scraper
      DB_USER: scraper
      DB_PASSWORD: scraper-password
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: dev-secret-key-change-in-production
      # O1: beat died for 10 days on prod with ModuleNotFoundError: No module
      # named 'src' — the worker sets PYTHONPATH=/app (below); beat did not,
      # so webapp/scraper/views.py's `from src...` failed at migrate time.
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # O1: no restart policy meant the Aug-6 crash stayed dead — the stuck-job
    # and auto-approve watchdogs never ran, which is why 3 jobs sat RUNNING
    # for days.
    healthcheck:
      # beat itself runs no worker; liveness = the cluster it schedules for
      # answers + this container can reach the broker. 'OK' per node line.
      test: ["CMD-SHELL", "celery -A config status 2>/dev/null | grep -q OK || exit 1"]
      interval: 60s
      retries: 3
      timeout: 20s
      start_period: 90s
    restart: unless-stopped
    mem_limit: 128m

  flower:
    profiles: ["full"]
    build: .
    command: celery -A config flower --port=5555
    volumes:
      - .:/app
    environment:
      DB_HOST: postgres
      DB_NAME: scraper
      DB_USER: scraper
      DB_PASSWORD: scraper-password
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: dev-secret-key-change-in-production
      # O1 (same class as beat's): flower imports the Django app (config →
      # scraper.views → from src...); without PYTHONPATH=/app it dies with
      # ModuleNotFoundError: src. It ran before only via the stale image.
      PYTHONPATH: /app
      # flower >=2.0: the API (used by the healthcheck) 401s without this;
      # the UI itself stays behind basic-auth creds when FLOWER_BASIC_AUTH
      # is set (set it on Railway — the port must not be public otherwise).
      FLOWER_UNAUTHENTICATED_API: "1"
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5555/api/workers"]
      interval: 60s
      retries: 3
      timeout: 10s
      start_period: 60s
    mem_limit: 128m

  browser_service:
    profiles: ["full"]
    build:
      context: .
      dockerfile: browser_service/Dockerfile
    init: true
    shm_size: 2g
    # Chrome crash dumps: without this, every Chrome crash writes a 100-413MB
    # core.* file to /app (707 of them = 61GB accumulated over 2 weeks; the
    # host kernel's core_pattern + inherited 'unlimited' ulimit produce them).
    # CDP auto-restart already recovers from crashes — the dumps are pure waste.
    ulimits:
      core:
        soft: 0
        hard: 0
    volumes:
      - ./browser_service:/app/browser_service
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./templates:/app/templates:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      DISPLAY: ":98"
      BROWSER_SERVICE_PORT: "8001"
      MCP_CDP_PORT: "19222"
      SCRAPER_CDP_PORT: "19223"
      PROXY_DATACENTER_HOST: ${PROXY_DATACENTER_HOST:-brd.superproxy.io}
      PROXY_DATACENTER_PORT: ${PROXY_DATACENTER_PORT:-22225}
      PROXY_DATACENTER_USER: ${PROXY_DATACENTER_USER:-}
      PROXY_DATACENTER_PASS: ${PROXY_DATACENTER_PASS:-}
      PROXY_RESIDENTIAL_HOST: ${PROXY_RESIDENTIAL_HOST:-brd.superproxy.io}
      PROXY_RESIDENTIAL_PORT: ${PROXY_RESIDENTIAL_PORT:-22225}
      PROXY_RESIDENTIAL_USER: ${PROXY_RESIDENTIAL_USER:-}
      PROXY_RESIDENTIAL_PASS: ${PROXY_RESIDENTIAL_PASS:-}
    ports:
      - "8001:8001"
      - "8111:8111"
      - "9222:9222"
      - "9223:9223"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      retries: 3
      timeout: 10s
      start_period: 45s
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 6g

  file-master:
    profiles: ["full"]
    build: ./file_master
    volumes:
      - ./shared-data:/data
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 10s
      retries: 3
      timeout: 5s
    restart: unless-stopped
    mem_limit: 256m

volumes:
  pgdata:
  redisdata:
