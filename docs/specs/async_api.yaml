asyncapi: 3.0.0

# ═══════════════════════════════════════════════════════════════════════════
# REALTIME / EVENT LAYER — PARTNER-FACING API (DRAFT)
#
# Sibling of sync_api.draft.yaml (sync REST). Vocabulary is LOCKED to the sync
# spec: job_id, user_id, states inprogress|scraper_ready|failed (THREE —
# sample readiness is the job.sample_ready EVENT + REST sample_available,
# never a state value; see JobState), X-API-Key auth, base path /api/v1/jobs.
# Do not rename unilaterally.
#
# HONESTY FLAGS — read before implementing:
#   x-status: live      — mechanism exists in the repo today (cited).
#   x-status: planned   — designed here, NOT built. Do not code against it
#                         assuming it exists.
# All three transports (callbacks, SSE bridge, WSS gateway) are BUILT —
# see "Transport reality" in info.description. Do not reintroduce phased
# promises without re-verifying the code first.
# ═══════════════════════════════════════════════════════════════════════════

info:
  title: Universal Ecommerce Scraper — Partner Event API
  version: 0.1.0-draft
  description: |
    Events for asynchronous scrape jobs. Jobs run 10–60 minutes; partners can
    either (a) give us a callback endpoint at submit time and we push events to
    them, or (b) hold an inbound subscription and receive the same events.

    ## Transport reality (IMPORTANT — read before building a client)

    All three transports below are BUILT in the repo today — this is no
    longer a phased promise (earlier drafts said "Phase 2 not built"; that
    text is stale):

      1. **Outbound callbacks** over HTTPS — built. EventOutbox model +
         dispatcher/reconciler beat tasks (`webapp/scraper/events/`:
         emitter.py, dispatcher.py, reconciler.py; the 30 s beat sweep is
         the `dispatch-pending-callbacks` entry in `settings.py:207-210`,
         task→pool routes at `:235-237`). We POST each event, signed
         with HMAC-SHA256. At-least-once delivery, dedupe by `event_id`.
      2. **Inbound subscription over SSE** — built
         (`webapp/scraper/api/sse.py` `job_events_sse`, mounted at
         `/api/v1/jobs/{job_id}/events`). Constrained stream: global
         concurrent budget of 1 (`PARTNER_STREAM_BUDGET`, over budget → 503
         immediately, never a hang; Redis down fails OPEN on the budget),
         hard stream deadline of 540 s (`PARTNER_STREAM_DEADLINE` — clients
         MUST auto-reconnect; the stream closing at 540 s is normal, not an
         error), and a `: ping` keepalive frame every 25 s of silence
         (`KEEPALIVE_SECONDS = 25`, below the documented 30 s proxy-kill
         window).
      3. **WSS gateway** — built (`event_gateway/app.py` + `gateway.py`,
         FastAPI+uvicorn — the same pattern as browser_service and
         file-master; the Django web tier itself remains gunicorn/WSGI).
         Redis pub/sub → WS frames; heartbeat.ping every ≤25 s of silence
         (`HEARTBEAT_SECONDS = 25`); unauthenticated handshakes are closed
         with code **4401** ("unauthorized").

    ## WS auth token exchange (because browsers cannot set headers)

    The browser `WebSocket` API cannot send `X-API-Key` — and neither can
    the WS handshake itself: the gateway reads QUERY PARAMETERS, not
    headers (`event_gateway/app.py:50-62`). The handshake accepts EITHER
    `?apikey=<raw key>` (non-browser convenience) OR a single-use token.
    Browser clients MUST first call the sync endpoint:

        POST /api/v1/ws-token        (header: X-API-Key)
        -> 201 { "token": "...", "expires_in": 300,
                 "connect_url": "/ws/v1/jobs?token=..." }

    The token is short-lived (300 s) and single-use; it is passed as the
    `token` query parameter on connect. Query-param tokens can leak into
    access logs — the 5-minute TTL and single-use nonce bound that exposure.
    This exchange endpoint belongs to the sibling OpenAPI spec; it is
    documented here because it is load-bearing for the WS server.

    ## State model (shared with the sync spec — do not fork)

    Partners observe exactly THREE states (audit round 4: an earlier draft
    of both specs said four and that was fiction — the projection in
    `webapp/scraper/api/state.py` never returns a sample state; sample
    readiness is the `job.sample_ready` EVENT plus the REST
    `sample_available` boolean, not a state value):

        inprogress -> scraper_ready
             \______> failed (from any state)

    with `job.sample_ready` firing as a MILESTONE EVENT while the state is
    still `inprogress`. They are a PROJECTION of the nine internal
    `ScrapeJob` statuses (`webapp/scraper/models.py:115-127`):

    | internal                              | partner state  |
    |---------------------------------------|----------------|
    | pending, running                      | inprogress     |
    | waiting_approval                      | inprogress (1) |
    | browser_unavailable (PARKED)          | inprogress (2) |
    | completed (scraper promoted, output   | scraper_ready  |
    | produced)                             |                |
    | failed, cancelled, captcha_blocked,   | failed         |
    | akamai_blocked                        |                |

    (1) Partner-submitted jobs run with approvals skipped (the `skip_approvals`
    flag already exists, `webapp/scraper/models.py:151-153`), so
    `waiting_approval` should never appear; if it does (budget escalation),
    the job stays `inprogress` and a supplementary
    `job.approval.required` event is emitted.

    (2) `browser_unavailable` is NON-terminal — the browser service is down
    and the job resumes automatically when it recovers. A consumer that
    omits this row from its state derivation will wrongly snapshot parked
    jobs as `failed` (the event gateway's `_STATE_MAP` had exactly this
    defect — see the sync spec's JobState note).

    Where the milestones actually come from (verified emit sites): the
    testing phase's output is persisted as the sample, which emits
    `job.sample_ready` `{item_count, sample_url}`
    (`webapp/scraper/api/sample_persist.py:81`); cleanup promoting the
    scraper emits `job.scraper_ready` `{}` IN-GRAPH
    (`webapp/agents/graph.py:1780`), with the reconciler backfilling
    `{reason: "scraper_ready"}` only when the graph never got to emit
    (`webapp/scraper/events/reconciler.py:53`). The pipeline produces the
    FULL output (run_execution) BEFORE cleanup promotes the scraper, so the
    `output` artifact event fires between `job.sample_ready` and
    `job.scraper_ready`. `scraper_ready` is the terminal success state
    UNLESS superseded by `failed` (rare post-promotion finalizer failure —
    clients must treat `job.failed` as the authoritative terminal event,
    matching the sync spec's JobState caveat).

    ## Ownership

    Every event envelope carries `user_id` (the API key's user). Subscriptions
    and callbacks are rejected unless `job.user_id == key.user_id` — the same
    owner check the internal UI enforces (`webapp/scraper/views.py:34-39`).
    Internally `ScrapeJob.user` is nullable (`webapp/scraper/models.py:154`);
    partner-facing endpoints MUST always set it — a null-owner job is
    invisible to partner flows.

defaultContentType: application/json

# ═══════════════════════════════════════════════════════════════════════════
# SERVERS
# ═══════════════════════════════════════════════════════════════════════════

servers:
  production-wss:
    host: api.example-scraper.internal
    pathname: /ws/v1
    protocol: wss
    title: Partner WSS gateway
    description: |
      WebSocket subscription endpoint — LIVE (event-gateway service, port
      8100). One multiplexed connection per client; subscribe/unsubscribe
      by job_id. Auth: single-use stream token query param (minted via
      POST /api/v1/ws-token) for browser clients, or the apikey query
      param carrying X-API-Key for non-browser clients (browsers cannot
      set WS headers — hence the token path).
    security:
      - $ref: '#/components/securitySchemes/apiKeyHeader'
      - $ref: '#/components/securitySchemes/wsTokenQuery'
    x-status: live
    x-token-exchange:
      method: POST
      path: /api/v1/ws-token
      auth: X-API-Key
      token_ttl_seconds: 300
      single_use: true

  production-sse:
    host: api.example-scraper.internal
    pathname: /api/v1
    protocol: https
    title: SSE bridge (partner endpoint BUILT — webapp/scraper/api/sse.py)
    description: |
      Server-Sent Events fallback carrying the SAME envelope payloads over
      `GET /api/v1/jobs/{job_id}/events`. The PARTNER variant is BUILT and
      live (`webapp/scraper/api/sse.py` `job_events_sse`, routed at
      `webapp/scraper/api/urls.py:48`) with X-API-Key/token auth, the
      owner check, and the envelope framing defined here. (The internal
      web-UI feed is a separate session-authenticated view at
      `webapp/scraper/views.py:1123` with its own ad-hoc framing — partners
      never touch it.) The event JSON is byte-identical to WSS/callback
      payloads, so client deserialization code does not change.

      BROWSER AUTH: the browser `EventSource` API cannot set X-API-Key
      (same limitation as WebSocket). Browser clients authenticate with
      `GET /api/v1/jobs/{job_id}/events?token=<single-use token>` using
      the SAME ws-token exchange the WSS gateway uses (300 s TTL,
      single-use — the minted `connect_url` points at this endpoint).
      Non-browser clients SHOULD use the header (header handshakes also
      pass the global per-key rate limit).
    security:
      - $ref: '#/components/securitySchemes/apiKeyHeader'
      - $ref: '#/components/securitySchemes/eventTokenQuery'
    x-status: live
    x-bridge-notes: |
      BUILT PARTNER FRAMING (webapp/scraper/api/sse.py): every `data:`
      frame is one EventEnvelope (the stream forwards the envelope JSON
      the emitter publishes to Redis); keepalive is a `: ping` comment
      frame every 25 s of silence. The stream OPENS with the current
      state — the terminal event if the job already finished, else
      `job.inprogress` `{internal_status}` — and CLOSES after the
      terminal event (a 10 s silent-channel status check synthesizes the
      terminal envelope even if the Redis publish was missed) or at the
      540 s hard deadline, whichever comes first.
      AUTH FAILURES: missing/expired/consumed token or bad key returns
      401 immediately (no stream); a job the key does not own is 404.
      Tokens are SINGLE-USE, so the browser EventSource auto-reconnect
      after a drop will 401 — clients must catch `onerror`, mint a fresh
      token (POST /api/v1/ws-token), and re-GET the stream; the old
      connect URL is NOT reusable.
      No `id:` / `Last-Event-ID` support exists — SSE here is LIVE-ONLY with
      no replay (verified: no id/retry fields emitted). Reconnect strategy:
      re-GET the stream, then reconcile via the sync job endpoint.

  partner-callback:
    host: '{callback_host}'
    protocol: '{callback_scheme}'
    title: Partner callback endpoint (we are the CLIENT)
    description: |
      Informational pseudo-server: the URL the partner supplied at submit
      time. We connect OUT to it and POST (https, Phase 1) or open an
      outbound WebSocket (wss, Phase 2) and push events. Variables are bound
      per-job from the `callback` object on POST /api/v1/jobs.
      wss:// callbacks require an always-on outbound WS client, which does
      not fit the Celery worker model well — Phase 1 supports https
      callbacks only; wss callbacks arrive with the Phase 2 gateway.
    variables:
      callback_host:
        description: Host of the partner-supplied callback URL.
      callback_scheme:
        description: "https (Phase 1) or wss (Phase 2)."
        enum: ['https', 'wss']
        default: 'https'
    x-status: live-planned-https
    x-security: |
      We authenticate TO the partner with an HMAC-SHA256 signature header.
      Partners cannot IP-allowlist us (Railway egress IPs are not static), so
      the signature is the primary proof of authenticity. See the
      deliverCallback operation.

# ═══════════════════════════════════════════════════════════════════════════
# CHANNELS
# ═══════════════════════════════════════════════════════════════════════════

channels:
  jobs:
    address: /ws/v1/jobs
    title: Job event subscription
    summary: One multiplexed WS connection; subscribe/unsubscribe by job_id.
    description: |
      A single connection per client. The client subscribes to jobs with
      `subscribe` control messages; the server confirms with
      `subscribe.ack` (which carries a state snapshot for late joiners) and
      then streams `job.*` events and `heartbeat.ping` frames
      (`HEARTBEAT_SECONDS = 25` — at least every 25 s of silence).

      AUTH (built — event_gateway/app.py:50-62): the handshake accepts an
      `apikey` QUERY PARAMETER (the raw key: `...?apikey=<key>`) OR a
      single-use 300 s query-param token from POST /api/v1/ws-token
      (the `token` query parameter). It does NOT read an X-API-Key header — browsers
      cannot send one and the WS server never looks for one.
      An unauthenticated handshake is closed with code **4401**
      ("unauthorized") — clients should treat 4401 as "credential problem,
      do not hot-reconnect"; mint a fresh token or fix the key first.

      Why one multiplexed endpoint rather than per-job URLs
      (`/ws/v1/jobs/{job_id}`): partners fan out many jobs per API key; N
      per-job connections cost N handshakes, N proxy slots, and N auth
      token exchanges. A single authenticated connection with cheap
      subscribe messages scales to a partner's whole job history, and the
      same `job_id` scoping rule applies per subscription.
    servers:
      - $ref: '#/servers/production-wss'
    messages:
      Subscribe:
        $ref: '#/components/messages/Subscribe'
      Unsubscribe:
        $ref: '#/components/messages/Unsubscribe'
      SubscribeAck:
        $ref: '#/components/messages/SubscribeAck'
      SubscribeNack:
        $ref: '#/components/messages/SubscribeNack'
      UnsubscribeAck:
        $ref: '#/components/messages/UnsubscribeAck'
      HeartbeatPing:
        $ref: '#/components/messages/HeartbeatPing'
      HeartbeatPong:
        $ref: '#/components/messages/HeartbeatPong'
      JobCreated:
        $ref: '#/components/messages/JobCreated'
      JobInprogress:
        $ref: '#/components/messages/JobInprogress'
      JobSampleReady:
        $ref: '#/components/messages/JobSampleReady'
      JobScraperReady:
        $ref: '#/components/messages/JobScraperReady'
      JobFailed:
        $ref: '#/components/messages/JobFailed'
      JobPhaseUpdated:
        $ref: '#/components/messages/JobPhaseUpdated'
      JobArtifactAvailable:
        $ref: '#/components/messages/JobArtifactAvailable'
      JobApprovalRequired:
        $ref: '#/components/messages/JobApprovalRequired'
      JobLogAppended:
        $ref: '#/components/messages/JobLogAppended'
      ProtocolError:
        $ref: '#/components/messages/ProtocolError'
    x-status: live

  jobEventsSse:
    address: /api/v1/jobs/{job_id}/events
    title: Per-job SSE feed
    description: |
      Server-Sent Events variant of the same feed, one stream per job, no
      subscribe messages (the job is in the URL). Emits the identical
      EventEnvelope JSON as the `data:` payload of each SSE frame. BUILT
      for partners (`webapp/scraper/api/sse.py` `job_events_sse`, routed at
      `webapp/scraper/api/urls.py:48`): X-API-Key header OR single-use
      stream-token auth, owner check (another key's job is a 404), envelope
      framing, keepalive, and the stream budget below — not a planned
      bridge.
      KEEPALIVE + LIMITS (built — webapp/scraper/api/sse.py): a `: ping`
      comment frame every 25 s of silence (`KEEPALIVE_SECONDS`, below the
      30 s proxy-kill window that caused a documented gunicorn
      WORKER-TIMEOUT storm on the internal feed); a HARD stream deadline of
      540 s (`PARTNER_STREAM_DEADLINE`) — the stream closing at 540 s is
      NORMAL, clients MUST auto-reconnect (no Last-Event-ID replay); and a
      global concurrent-stream budget of 1 (`PARTNER_STREAM_BUDGET`, shared
      with the internal UI) — over budget the request is refused with 503
      immediately, never queued to hang; the budget FAILS OPEN if Redis is
      down (auth still holds).
    servers:
      - $ref: '#/servers/production-sse'
    parameters:
      job_id:
        description: >-
          Numeric ScrapeJob id (same identifier as the sync API) as a decimal
          string in the topic address; the message payload carries it as a
          JSON integer.
        location: $message.payload#/job_id
    messages:
      JobCreated:
        $ref: '#/components/messages/JobCreated'
      JobInprogress:
        $ref: '#/components/messages/JobInprogress'
      JobSampleReady:
        $ref: '#/components/messages/JobSampleReady'
      JobScraperReady:
        $ref: '#/components/messages/JobScraperReady'
      JobFailed:
        $ref: '#/components/messages/JobFailed'
      JobPhaseUpdated:
        $ref: '#/components/messages/JobPhaseUpdated'
      JobArtifactAvailable:
        $ref: '#/components/messages/JobArtifactAvailable'
      JobApprovalRequired:
        $ref: '#/components/messages/JobApprovalRequired'
    x-status: live

  partnerCallback:
    address: '#/callback'
    title: Outbound event delivery to the partner
    description: |
      We are the APPLICATION (the sender); the partner's endpoint is the
      server. Modeled as a channel we `send` on — the AsyncAPI 3 way to
      describe a webhook-style outbound integration. Delivery is HTTPS POST
      of one EventEnvelope per request (Phase 1). The partner replies 2xx to
      accept; anything else (or a timeout) schedules a retry.
    servers:
      - $ref: '#/servers/partner-callback'
    messages:
      JobCreated:
        $ref: '#/components/messages/JobCreated'
      JobInprogress:
        $ref: '#/components/messages/JobInprogress'
      JobSampleReady:
        $ref: '#/components/messages/JobSampleReady'
      JobScraperReady:
        $ref: '#/components/messages/JobScraperReady'
      JobFailed:
        $ref: '#/components/messages/JobFailed'
      JobArtifactAvailable:
        $ref: '#/components/messages/JobArtifactAvailable'
      JobPhaseUpdated:
        $ref: '#/components/messages/JobPhaseUpdated'
      CallbackReenabled:
        $ref: '#/components/messages/CallbackReenabled'
    x-status: live

# ═══════════════════════════════════════════════════════════════════════════
# OPERATIONS
# ═══════════════════════════════════════════════════════════════════════════

operations:
  # ── Inbound WS: client → server control messages ──────────────────────
  receiveSubscriptions:
    action: receive
    channel:
      $ref: '#/channels/jobs'
    title: Receive subscribe/unsubscribe/pong from the client
    summary: The application consumes control messages.
    security:
      - $ref: '#/components/securitySchemes/apiKeyHeader'
      - $ref: '#/components/securitySchemes/wsTokenQuery'
    messages:
      - $ref: '#/channels/jobs/messages/Subscribe'
      - $ref: '#/channels/jobs/messages/Unsubscribe'
      - $ref: '#/channels/jobs/messages/HeartbeatPong'
    x-status: live

  # ── Inbound WS: server → client events ────────────────────────────────
  sendJobEvents:
    action: send
    channel:
      $ref: '#/channels/jobs'
    title: Push job events to subscribed clients
    summary: |
      Fires for every subscribed job. Ordering per job_id is guaranteed by
      `event_id` monotonicity (ULID); ordering ACROSS jobs is not. Delivery
      is live-only in the first release — there is no replay buffer. A
      client that reconnects re-subscribes and reconciles from the
      `subscribe.ack` state snapshot plus the sync job endpoint. A Redis
      Streams replay buffer (`since_event_id`) is the designated Phase 2.5
      upgrade and is already accepted by the `subscribe` message shape.
    security:
      - $ref: '#/components/securitySchemes/apiKeyHeader'
      - $ref: '#/components/securitySchemes/wsTokenQuery'
    messages:
      - $ref: '#/channels/jobs/messages/SubscribeAck'
      - $ref: '#/channels/jobs/messages/SubscribeNack'
      - $ref: '#/channels/jobs/messages/UnsubscribeAck'
      - $ref: '#/channels/jobs/messages/HeartbeatPing'
      - $ref: '#/channels/jobs/messages/JobCreated'
      - $ref: '#/channels/jobs/messages/JobInprogress'
      - $ref: '#/channels/jobs/messages/JobSampleReady'
      - $ref: '#/channels/jobs/messages/JobScraperReady'
      - $ref: '#/channels/jobs/messages/JobFailed'
      - $ref: '#/channels/jobs/messages/JobPhaseUpdated'
      - $ref: '#/channels/jobs/messages/JobArtifactAvailable'
      - $ref: '#/channels/jobs/messages/JobApprovalRequired'
      - $ref: '#/channels/jobs/messages/JobLogAppended'
      - $ref: '#/channels/jobs/messages/ProtocolError'
    x-status: live
    x-heartbeat: |
      Server sends heartbeat.ping every 25 s of silence. Rationale: the
      INTERNAL web-UI SSE feed has no transport keepalive at all (the
      "heartbeat" at webapp/agents/graph.py:762 writes SessionLog DB rows
      for the stuck-job watchdog — it emits no transport frames), so idle
      connections there are exposed to proxy idle timeouts during long
      quiet LLM phases. The partner surfaces do NOT repeat that mistake:
      the partner SSE stream sends a `: ping` comment every 25 s
      (`KEEPALIVE_SECONDS = 25`), and this gateway pings on the same
      cadence (`HEARTBEAT_SECONDS = 25`).

  # ── SSE bridge ─────────────────────────────────────────────────────────
  streamJobEventsSse:
    action: send
    channel:
      $ref: '#/channels/jobEventsSse'
    title: Stream per-job events over SSE
    summary: |
      The stream opens with the current state — the terminal event if the
      job already finished, else `job.inprogress` `{internal_status}` —
      and closes after the terminal event or at the 540 s hard deadline
      (webapp/scraper/api/sse.py `event_stream`). Live-only, no replay;
      the 25 s `: ping` keepalive frames are comments, not events.
    security:
      - $ref: '#/components/securitySchemes/apiKeyHeader'
      - $ref: '#/components/securitySchemes/eventTokenQuery'
    messages:
      - $ref: '#/channels/jobEventsSse/messages/JobCreated'
      - $ref: '#/channels/jobEventsSse/messages/JobInprogress'
      - $ref: '#/channels/jobEventsSse/messages/JobSampleReady'
      - $ref: '#/channels/jobEventsSse/messages/JobScraperReady'
      - $ref: '#/channels/jobEventsSse/messages/JobFailed'
      - $ref: '#/channels/jobEventsSse/messages/JobPhaseUpdated'
      - $ref: '#/channels/jobEventsSse/messages/JobArtifactAvailable'
      - $ref: '#/channels/jobEventsSse/messages/JobApprovalRequired'
    x-status: live

  # ── Outbound callback: WE send, partner receives ──────────────────────
  deliverCallback:
    action: send
    channel:
      $ref: '#/channels/partnerCallback'
    title: Deliver events to the partner callback endpoint
    summary: |
      One EventEnvelope per POST request (https, Phase 1). The partner
      responds 2xx to accept. Non-2xx or timeout (10 s connect / 10 s read)
      schedules a retry.
    description: |
      ## Delivery semantics — at-least-once

      Retries: 6 attempts total (initial POST + 5 retries), backoff gaps
      10 s, 1 m, 10 m, 1 h, 6 h (minimum delays — the 30 s dispatcher
      sweep quantizes; legs >= 1 m are self-scheduled and exact).
      `event_id` is stable across retries; partners MUST dedupe on it.
      Events are delivered in order per job while healthy, but retries can
      reorder across jobs and (rarely) within a job during failover —
      partners should treat `event_id` ordering, not arrival order, as
      authoritative.

      ## Disabled-callback policy

      After the final failed attempt the callback is marked disabled
      (`status: "disabled"`, `disabled_reason`, `last_failure` — visible on
      the job in the sync API as `callback`), event delivery for that job
      stops, and the data remains fetchable via the sync endpoints forever.
      Re-enabling is an explicit partner action: `PATCH
      /api/v1/jobs/{job_id}/callback` with `{"action": "reenable"}` (see
      the sibling sync spec). Re-enable has a 60 s cooldown per job. HONESTY
      (corrected per audit — earlier drafts over-promised): re-enable does
      NOT reset the attempt counters on already-exhausted outbox rows (a
      re-armed callback delivers only events still pending; poison events
      stay dead), and there is NO outbox prune in v1 — nothing expires
      outbox rows (the "30-day prune" in earlier drafts was never built);
      rows accumulate for the job's lifetime. A `callback.reenabled` event
      is emitted on re-arm. Rotation (`action=rotate`) swaps the URL/secret
      atomically at the next dispatch — in-flight deliveries during the
      swap complete under the OLD signature (verifiers should accept either
      secret for a 30 s rotation window).

      ## SSRF re-validation at delivery time

      Every delivery attempt re-runs the registration SSRF gate on the
      stored URL (dispatcher `_deliver`: validate → sign → POST). If the
      host has stopped resolving public (DNS change, rebinding, hostname
      repointed at an internal address) the callback is DISABLED IMMEDIATELY
      — `disabled_reason: "SSRF re-validation failed: <reason>"` — and no
      POST is attempted. This is an instant-disable, not a retryable
      failure.

      ## Security — how we authenticate TO the partner

      Partners cannot IP-allowlist us, so every request is signed:

          X-Scraper-Signature: t=<unix_ts>,v1=<hex hmac_sha256("<t>." + raw_body, callback_secret)>
          X-Scraper-Event-Id:  <event_id>
          X-Scraper-Job-Id:    <job_id>

      The partner verifies by recomputing the HMAC over
      `"<t>." + request_body` with the secret they registered, then
      rejecting stale timestamps (recommend ±300 s) to defeat replay. The
      secret is supplied once at callback registration and never appears
      in events or logs. HMAC-SHA256 signing requires the raw secret at
      every delivery attempt, so the secret CANNOT be stored hashed — it
      is stored raw at rest in a column that no API
      response, log line, or admin view ever serializes (test-locked).
      This corrects an earlier draft that said "hashed at rest.

      ## Dispatcher implementation note

      BUILT (earlier drafts said "must be built" — stale): the EventOutbox
      model exists (`webapp/scraper/models.py:515+`, dedupe index on
      job/event_type/dedupe_key), and the beat scheduler runs
      `dispatch_pending_callbacks` (sweep) + `deliver_callback` (per-POST)
      + a reconciler that re-emits terminal states the graph never did
      (`webapp/scraper/events/dispatcher.py`, `reconciler.py`; the 30 s
      beat sweep is the `dispatch-pending-callbacks` entry in
      `settings.py:207-210`, task→pool routes at `:235-237`). Two-phase
      claim: FOR UPDATE
      SKIP LOCKED select nominates candidates; a dead worker's lease is
      reclaimed AND burns one attempt so poison events still reach
      exhaustion. Events enter the outbox at publish time alongside the
      Redis publish hook, which gives at-least-once semantics for free
      (outbox row survives worker death; Redis fan-out does not).
    messages:
      - $ref: '#/channels/partnerCallback/messages/JobCreated'
      - $ref: '#/channels/partnerCallback/messages/JobInprogress'
      - $ref: '#/channels/partnerCallback/messages/JobSampleReady'
      - $ref: '#/channels/partnerCallback/messages/JobScraperReady'
      - $ref: '#/channels/partnerCallback/messages/JobFailed'
      - $ref: '#/channels/partnerCallback/messages/JobArtifactAvailable'
    x-status: live
    x-signature-header: X-Scraper-Signature
    x-retry:
      # 6 attempts (5 backoff gaps between them). Backoff values are
      # MINIMUM delays: delivery is driven by a 30 s dispatcher sweep, so
      # the effective delay per leg is backoff + [0, 30] s; legs >= 1 m
      # are additionally self-scheduled with an exact countdown and are
      # honored exactly. On exhaustion the callback is disabled (see the
      # PATCH re-enable endpoint in the sibling sync spec).
      attempts: 6
      backoff: [10s, 1m, 10m, 1h, 6h]
      timeout: {connect: 10s, read: 10s}
      on_exhaustion: disable_callback

# ═══════════════════════════════════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════════════════════════════════

components:
  securitySchemes:
    eventTokenQuery:
      type: httpApiKey
      in: query
      name: token
      description: Single-use 300s token from POST /api/v1/ws-token (browser EventSource clients).
    apiKeyHeader:
      type: httpApiKey
      name: X-API-Key
      in: header
      description: |
        Same key + same header as the sibling OpenAPI spec. Identifies the
        partner user; `user_id` in every event envelope is derived from
        this key.
    wsTokenQuery:
      type: httpApiKey
      name: token
      in: query
      description: |
        Short-lived (300 s), single-use token from POST /api/v1/ws-token —
        the browser-compatible path, since the browser WebSocket API
        cannot set headers (the whole handshake is query-parameter
        driven). Non-browser clients MAY pass the raw key instead via the
        `apikey` query parameter (`?apikey=<key>` — verified:
        event_gateway/app.py reads `ws.query_params.get("apikey")`).

  schemas:
    # ── Core shared vocabulary ────────────────────────────────────────────
    JobState:
      type: string
      description: |
        Partner-visible lifecycle state — locked vocabulary, shared with
        the sibling OpenAPI spec, and THREE-valued there. The projection
        (`webapp/scraper/api/state.py` + the gateway `_STATE_MAP`) NEVER
        returns a sample state: sample readiness is the `job.sample_ready`
        EVENT plus the REST `sample_available` boolean, never a state
        value. An earlier draft of both specs carried a fourth
        `sample_ready` member; that was fiction. Enum values here are
        exactly what `subscribe.ack` snapshots and `job.created` carry.
      enum: [inprogress, scraper_ready, failed]

    EventEnvelope:
      type: object
      description: |
        Every event on every transport (WS frame, SSE data frame, callback
        POST body) is this envelope. Transport framing differs; the JSON is
        identical.

        v1 PAYLOAD SCOPE (deliberate, and VERIFIED against the emitters):
        state events carry a MINIMAL `data` — the envelope `type` IS the
        state signal, `data.state` is NOT duplicated into the payload. The
        authoritative rich state lives in the WSS subscribe.ack snapshot and
        the REST job resource; partners reconcile via those. Exact v1 data
        shapes as emitted (`webapp/scraper/api/writers.py`,
        `sample_persist.py`, `output_index.py`, `events/reconciler.py`):
          - job.created        → {state, url, content_type, input_mode,
                                  rerun_of, callback} (no previous_state;
                                  callback is null when unregistered)
          - job.inprogress     → {internal_status}
          - job.sample_ready   → {item_count, sample_url}
          - job.scraper_ready  → {}   happy path — emitted IN-GRAPH at
                                  scraper promotion (graph.py
                                  _promote_scraper); the beat reconciler
                                  backfills {reason: "scraper_ready"} ONLY
                                  when the graph never emitted it (crash
                                  window). Treat `reason` as optional.
          - job.failed         → {reason}   — reason is the STATUS TOKEN
                                  (pipeline_failed | cancelled |
                                  captcha_blocked | akamai_blocked), never
                                  the human error_message
          - job.artifact.available → FLAT {kind, url, records?|item_count?,
                                  key?} — kinds sample, output AND
                                  scraper_code (emitted at promotion with
                                  the File Master key in `key`);
                                  dagster_code has no emit site in v1
          - job.phase.updated  → {phase, phase_status} — emitted at the
                                  single phase choke point (graph.py
                                  _notify_phase) for every phase
                                  transition on partner jobs
          - callback.reenabled → {}
        `job.approval.required` and `job.log.appended` are NOT emitted in
        v1 (partner jobs run with approvals skipped; log streaming is
        internal-only) — reserved enum values for a future release.
        size_bytes/sha256 on artifact events are future additions.
      required: [event_id, type, occurred_at, job_id, user_id, data]
      additionalProperties: false
      properties:
        event_id:
          type: string
          description: |
            ULID. Monotonic per producer — lexicographic sort equals
            causal order. Use for dedup (callbacks are at-least-once) and,
            later, for `since_event_id` replay cursors.
          examples: ['01JZQ3V8W2C4B6D8F0H2J4L6N8P']
        type:
          type: string
          description: |
            Event type. The state events (`job.created`, `job.inprogress`,
            `job.sample_ready`, `job.scraper_ready`, `job.failed`) are the
            only ones a minimal partner integration needs. Note
            `job.sample_ready` is a MILESTONE EVENT, not a state — the
            JobState value stays `inprogress` through it (see JobState and
            the State model section).
          enum:
            - job.created
            - job.inprogress
            - job.sample_ready
            - job.scraper_ready
            - job.failed
            - job.phase.updated
            - job.artifact.available
            - job.approval.required
            - job.log.appended
            - callback.reenabled
        occurred_at:
          type: string
          format: date-time
          description: When the transition happened server-side (ISO 8601, UTC).
        job_id:
          type: integer
          description: Same identifier as the sync API (ScrapeJob pk).
        user_id:
          type: integer
          description: |
            The API key's user id. Customer-facing by requirement — present
            in both the sync and the event flows. Events for a job whose
            owner is not the subscriber are never delivered.
        data:
          type: object
          description: Type-specific payload; one of the *Data schemas.

    # ── Event payloads ────────────────────────────────────────────────────
    JobCreatedData:
      type: object
      description: |
        Emitted once, when POST /api/v1/jobs returns 202. A create refused
        with 409 (`duplicate_running_job` or `site_already_processed`) emits
        no event — there is no job, so subscribers learn of the refusal only
        from the synchronous response.
      required: [state, url, content_type, input_mode]
      properties:
        state: { $ref: '#/components/schemas/JobState' }
        url: { type: string, format: uri, description: Target site URL. }
        content_type:
          type: string
          description: One of the 11 content page types (product, article,
            job_posting, ...).
          examples: [product, job_posting, article]
        input_mode:
          type: string
          enum: [url_list, navigation, list_page, search_term]
        search_criteria: { type: string, description: Query, for search modes. }
        rerun_of:
          type: ['integer', 'null']
          description: |
            Chain-root job id when the created job is a re-run (wave-27
            lineage; null for API-created jobs today — re-runs are born
            UI-side). Present so the event schema matches
            JobStatus.rerun_of on the sync API.
        callback:
          description: |
            The submit-time callback, VERBATIM from the emitter — and NULL
            when the job was created without one (the emit site writes
            `"callback": null`, webapp/scraper/api/writers.py:304-308). The
            create event's projection is reduced to `{url, status}`; the
            full registration state (disabled_reason, counters) comes from
            the sync API's GET /callback.
          oneOf:
            - $ref: '#/components/schemas/CallbackStatus'
            - type: 'null'
      examples:
        - state: inprogress
          url: 'https://example-store.com/products/widget'
          content_type: product
          input_mode: url_list
          rerun_of: null
          callback:
            url: 'https://partner.example/hooks/scraper'
            status: active

    StateChangeData:
      type: object
      description: |
        Shared shape of the four state events' `data`. V1 REALITY (corrected
        per audit — earlier drafts required `state`/`previous_state` here but
        NO emitter produced them): the payload does NOT carry the state —
        the envelope `type` (`job.inprogress` … `job.failed`) is the state
        signal. Required is therefore empty; each emitter writes only the
        fields below that it needs. Partners wanting a normalized view
        derive `state` from `type` and fill gaps from the REST resource.
      required: []
      properties:
        internal_status:
          type: string
          description: job.inprogress only — the internal ScrapeJob.status
            that produced the transition (e.g. running, waiting_approval).
        reason:
          type: string
          description: |
            OPTIONAL. On `job.failed` this is the failure STATUS TOKEN
            (`pipeline_failed` | `cancelled` | `captcha_blocked` |
            `akamai_blocked`) — NOT the human error_message (that lives in
            the REST `failure.message`). On `job.scraper_ready` it appears
            only in the reconciler's backfill (`"scraper_ready"`) when the
            in-graph emit never happened; the happy-path payload is `{}`.
        item_count:
          type: integer
          description: |
            Substantive items extracted so far (internal product_count).
            Written on sample_ready.
        sample_url: { type: string, description: Sync API sample endpoint (3). }
        output_url: { type: string, description: Sync API full-output endpoint (4). }
        scraper_code_url: { type: string, description: Sync API scraper-code endpoint (5). }

    ArtifactDescriptor:
      type: object
      description: |
        RESERVED for a future release: a by-reference artifact descriptor
        (url + integrity metadata) intended to replace the flat
        ArtifactAvailableData payload when size_bytes/sha256 land. Not
        emitted anywhere in v1 — artifact events are flat
        {kind, url, records?|item_count?}. Big artifacts are delivered BY
        REFERENCE either way: full outputs reach tens of thousands of
        records (a 26,742-item job exists in production history) and have
        already caused OOM/hang incidents when moved as blobs; only the
        small sample is inlined via `records`.
      required: [kind, url]
      properties:
        kind:
          type: string
          enum: [sample, output, scraper_code, dagster_code]
        url:
          type: string
          description: |
            RELATIVE path on the API host (e.g. /api/v1/jobs/{job_id}/output)
            — fetch with the same X-API-Key header used everywhere else. No
            pre-signed URLs, no token query params: the sync spec's endpoints
            are the only artifact surface, so both specs share one auth model.
            Backed by the File Master, surfaced through the Django proxy so
            partners never touch internal services.
        size_bytes: { type: integer }
        sha256: { type: string, description: Hex digest for integrity checks. }
        item_count:
          type: integer
          description: For sample/output — number of records inside.

    ArtifactAvailableData:
      type: object
      description: |
        V1 REALITY (corrected per audit — earlier drafts required a nested
        `artifact` descriptor, but the emitters write a FLAT payload):
        `data` is `{kind, url, ...}` directly (sample_persist.py,
        output_index.py, graph.py _promote_scraper). Ordering (matches the
        real pipeline): sample (at sample_ready) → scraper_code (at
        promotion, before the terminal event) → output (published by the
        finalizer AFTER the graph ends; arrives with, never before, the
        terminal status event). Only `dagster_code` has no emit site in v1.
        event_id order (ULID), not arrival order, is authoritative.
      required: [kind, url]
      properties:
        kind:
          type: string
          enum: [sample, output, scraper_code, dagster_code]
          description: |
            `sample`, `output` and `scraper_code` are emitted in v1;
            `dagster_code` is the one reserved value with no emit site.
        key:
          type: string
          description: |
            scraper_code events only — the File Master key of the promoted
            scraper (e.g. scrapers/{slug}/jobs/scraper-{job_id}.py).
        url:
          type: string
          description: |
            RELATIVE path on the API host (e.g. /api/v1/jobs/{job_id}/output)
            — fetch with the same X-API-Key header used everywhere else.
        records:
          type: array
          description: |
            INLINE records — present ONLY when kind=sample (the sample is
            small and already persisted to
            scrapers/{slug}/samples/sample-{job_id}.json). Absent for
            output — fetch via `url`.
          items: { type: object, additionalProperties: true }
        item_count:
          type: integer
          description: Written on output events (total items in the index).

    PhaseUpdatedData:
      type: object
      description: |
        Fine-grained pipeline progress — EMITTED on every partner-job phase
        transition from the single phase choke point (graph.py
        `_notify_phase`); partners filtering for it on the WSS gateway
        receive it live. Maps 1:1 to the Step model's (phase, status). A
        minimal partner may still ignore these and listen only to the four
        state events.
      required: [phase, phase_status]
      properties:
        phase:
          type: string
          description: Internal pipeline phase (site_analysis, testing,
            cleanup, ...).
        phase_status:
          type: string
          enum: [running, done, failed, skipped]
          description: |
            Mirrors Step.status (webapp/scraper/models.py:283-289).
            `skipped` is load-bearing: a phase that never ran on a resumed
            job is recorded as skipped — never done (wave-30 W30-9).

    ApprovalRequiredData:
      type: object
      description: |
        The job paused for a human decision. Should NOT occur for partner
        jobs (they run with skip_approvals, webapp/scraper/models.py:151);
        surfaces only on budget escalation. Maps to the internal
        `approval` event (webapp/scraper/services.py:365). Partner state
        remains `inprogress`.
      required: [approval_id, approval_type, question]
      properties:
        approval_id: { type: integer }
        approval_type: { type: string }
        question: { type: string }
        options: { type: array, items: { type: string } }
      examples:
        - approval_id: 88
          approval_type: budget_escalation
          question: 'code_writer exhausted its budget — escalate?'
          options: [escalate, cancel]

    LogAppendedData:
      type: object
      description: |
        Opt-in agent log tail (same batch shape as the internal `logs`
        event, webapp/scraper/services.py:115 — seq-monotonic, ordered,
        resumable via the sync logs endpoint with since_seq). Delivered
        only to subscribers that requested it in `subscribe.events`.
      required: [logs]
      properties:
        logs:
          type: array
          items:
            type: object
            required: [seq, role, content, created_at]
            properties:
              seq: { type: integer }
              role: { type: string, enum: [user, assistant, tool, system] }
              agent: { type: string }
              content: { type: string }
              created_at: { type: string, format: date-time }

    CallbackStatus:
      type: object
      description: |
        State of the submit-time callback, echoed in job.created and
        readable via the sync API. `disabled` means delivery stopped after
        retries were exhausted — data is still fetchable synchronously.
      required: [url, status]
      properties:
        url: { type: string, format: uri }
        status: { type: string, enum: [active, disabled] }
        disabled_reason: { type: string }
        last_failure: { type: [string, 'null'], description: Most recent delivery error summary (truncated) — same field and type as the sync API's CallbackStatus.last_failure. }
        last_delivered_at: { type: string, format: date-time }
        delivered_count: { type: integer }
        pending_count: { type: integer }
        created_at: { type: string, format: date-time }

    # ── WS control payloads ───────────────────────────────────────────────
    SubscribeData:
      type: object
      description: |
        Client → server. Also acts as the replay cursor request for the
        Phase 2.5 buffer: if `since_event_id` is honored the server replays
        buffered events after the ack; today (Phase 2.0) it is accepted
        and answered from the state snapshot only.
      required: [job_id]
      additionalProperties: false
      properties:
        job_id: { type: integer }
        events:
          type: array
          description: |
            Filter. Default (gateway DEFAULT_EVENT_FILTER,
            event_gateway/gateway.py:182-189) is job.created, the four
            state events (job.inprogress, job.sample_ready,
            job.scraper_ready, job.failed), and job.artifact.available.
            Add 'job.log.appended' for the agent tail; add
            'job.phase.updated' for per-phase progress.
          items:
            type: string
            enum:
              - job.inprogress
              - job.sample_ready
              - job.scraper_ready
              - job.failed
              - job.artifact.available
              - job.phase.updated
              - job.approval.required
              - job.log.appended
        since_event_id:
          type: string
          description: Optional replay cursor (Phase 2.5; ignored in 2.0).
      examples:
        - job_id: 345
          events: [job.sample_ready, job.scraper_ready, job.failed,
                   job.artifact.available]

    SubscribeAckData:
      type: object
      description: |
        Server → client. The snapshot is the late-joiner recovery
        mechanism and the ONLY reconnect guarantee in the first releases
        (no replay buffer): if the snapshot shows a terminal or advanced
        state, skip waiting for events you already missed and fetch
        artifacts via the sync API.
      required: [job_id, state, snapshot]
      properties:
        job_id: { type: integer }
        state: { $ref: '#/components/schemas/JobState' }
        snapshot:
          type: object
          properties:
            last_event_id: { type: string }
            item_count:
              type: ['integer', 'null']
              description: Internal product_count — NULL while the state is
                `inprogress` (the gateway masks it for non-terminal jobs,
                event_gateway/gateway.py:168); final count once terminal.
            sample_url: { type: string }
            output_url: { type: string }
            scraper_code_url: { type: string }
      examples:
        - job_id: 345
          state: scraper_ready
          snapshot:
            last_event_id: '01JZQ3V8W2C4B6D8F0H2J4L6N8P'
            item_count: 5
            sample_url: '/api/v1/jobs/345/sample'
            output_url: '/api/v1/jobs/345/output'
            scraper_code_url: '/api/v1/jobs/345/scraper-code'

    NackData:
      type: object
      description: |
        Rejected subscribe. `job_not_found` covers both missing jobs and
        jobs owned by another user — the owner check mirrors the internal
        `_get_job` rule (webapp/scraper/views.py:34-39).
      required: [job_id, error_code, message]
      properties:
        job_id: { type: integer }
        error_code:
          type: string
          enum: [job_not_found, token_expired, invalid_message]
        message: { type: string }
      examples:
        - job_id: 345
          error_code: job_not_found
          message: 'job 345 belongs to another user'

    HeartbeatData:
      type: object
      description: |
        Server → client ping every 25 s of silence; client SHOULD pong.
        App-level rather than WS protocol-level pings because intermediary
        proxies terminate on their own idle timers regardless of protocol
        ping visibility.
      properties:
        server_time: { type: string, format: date-time }
      examples:
        - server_time: '2026-08-20T09:15:00Z'

    UnsubscribeData:
      type: object
      required: [job_id]
      properties:
        job_id: { type: integer }

    ProtocolErrorData:
      type: object
      description: Malformed control message; the connection stays open.
      required: [error_code, message]
      properties:
        error_code: { type: string }
        message: { type: string }
      examples:
        - error_code: invalid_message
          message: 'expected {job_id: integer}'

  messages:
    # ── Control ───────────────────────────────────────────────────────────
    Subscribe:
      name: subscribe
      title: Subscribe to a job's events
      payload:
        type: object
        required: [op, data]
        properties:
          op: { type: string, const: subscribe }
          data: { $ref: '#/components/schemas/SubscribeData' }
      examples:
        - payload:
            op: subscribe
            data: { job_id: 345, events: [job.scraper_ready, job.failed] }

    Unsubscribe:
      name: unsubscribe
      title: Stop receiving a job's events
      payload:
        type: object
        required: [op, data]
        properties:
          op: { type: string, const: unsubscribe }
          data: { $ref: '#/components/schemas/UnsubscribeData' }

    SubscribeAck:
      name: subscribe.ack
      title: Subscription confirmed
      payload:
        type: object
        required: [op, data]
        properties:
          op: { type: string, const: subscribe.ack }
          data: { $ref: '#/components/schemas/SubscribeAckData' }

    SubscribeNack:
      name: subscribe.nack
      title: Subscription rejected
      payload:
        type: object
        required: [op, data]
        properties:
          op: { type: string, const: subscribe.nack }
          data: { $ref: '#/components/schemas/NackData' }

    UnsubscribeAck:
      name: unsubscribe.ack
      title: Unsubscription confirmed
      payload:
        type: object
        properties:
          op: { type: string, const: unsubscribe.ack }
          data: { $ref: '#/components/schemas/UnsubscribeData' }

    HeartbeatPing:
      name: heartbeat.ping
      title: Server keepalive
      payload:
        type: object
        properties:
          op: { type: string, const: heartbeat.ping }
          data: { $ref: '#/components/schemas/HeartbeatData' }

    HeartbeatPong:
      name: heartbeat.pong
      title: Client keepalive response
      payload:
        type: object
        properties:
          op: { type: string, const: heartbeat.pong }
          data: { $ref: '#/components/schemas/HeartbeatData' }

    ProtocolError:
      name: error
      title: Control-plane error
      payload:
        type: object
        properties:
          op: { type: string, const: error }
          data: { $ref: '#/components/schemas/ProtocolErrorData' }

    # ── The four state events (core contract, shared by ALL transports) ──
    JobCreated:
      name: job.created
      title: Job accepted
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              type: { const: job.created }
              data: { $ref: '#/components/schemas/JobCreatedData' }
      examples:
        - payload:
            event_id: '01JZQ3V8W2C4B6D8F0H2J4L6N8P'
            type: job.created
            occurred_at: '2026-08-20T09:00:00Z'
            job_id: 345
            user_id: 12
            data:
              state: inprogress
              url: 'https://example-store.com/products/widget'
              content_type: product
              input_mode: url_list
              callback:
                url: 'https://partner.example/hooks/scraper'
                status: active

    JobInprogress:
      name: job.inprogress
      title: Job entered inprogress
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              type: { const: job.inprogress }
              data: { $ref: '#/components/schemas/StateChangeData' }
      examples:
        - payload:
            event_id: '01JZQ3W0K2M4N6P8R0T2V4X6Z8A'
            type: job.inprogress
            occurred_at: '2026-08-20T09:00:41Z'
            job_id: 345
            user_id: 12
            data: { internal_status: running }

    JobSampleReady:
      name: job.sample_ready
      title: Sample extraction validated
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              type: { const: job.sample_ready }
              data: { $ref: '#/components/schemas/StateChangeData' }
      examples:
        - payload:
            event_id: '01JZQ3Y4C6E8G0I2K4M6O8Q0S2U'
            type: job.sample_ready
            occurred_at: '2026-08-20T09:14:02Z'
            job_id: 345
            user_id: 12
            data:
              item_count: 5
              sample_url: '/api/v1/jobs/345/sample'

    JobScraperReady:
      name: job.scraper_ready
      title: Scraper promoted + full output available (terminal success)
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              type: { const: job.scraper_ready }
              data: { $ref: '#/components/schemas/StateChangeData' }
      examples:
