  # ─────────────────────────────────────────────────────────────────────────
  # 3. SAMPLE RESPONSE
  # ─────────────────────────────────────────────────────────────────────────
  /api/v1/jobs/{job_id}/sample:
    parameters:
      - $ref: "#/components/parameters/jobId"
    get:
      tags: [artifacts]
      operationId: getJobSample
      summary: Get the sample extraction (available before the run completes)
      description: |
        The small, early artifact: up to 5 extracted records produced while the
        extractor was being built and validated (testing phase /
        field_confirmation). Available in state `sample_ready`, and best-effort
        in `failed` (a failed full run may still have a perfectly good sample —
        see the guarantee in the info block).

        **Never paginated.** Samples are capped at
        `FIELD_CONFIRMATION_SAMPLE_COUNT = 5` records
        (webapp/agents/nodes/field_confirmation.py:23) and pruned to the
        requested schema for display (field_confirmation.py:229-237), so the
        payload is a few KB at most.

        **Implementation provenance (LOUD)**: as of this draft the pipeline
        persists the sample as (a) coverage statistics in
        `scrapers/{slug}/analysis/test_report.json` (graph.py:586-603) and (b)
        a truncated text blob in a SessionLog row
        (field_confirmation.py:510-527). Neither is structured records. Serving
        this endpoint as specified requires persisting the sample records as
        JSON in the File Master (recommended key:
        `scrapers/{slug}/samples/sample-{job_id}.json`) when field_confirmation
        runs — the records are already in hand at that point (they come from
        the workspace `output_*.json` the tester wrote). `field_coverage`
        in the response is sourced from the test report when present.
      responses:
        "200":
          description: Sample records. `items` uses the job's output key (`products`, `jobs`, `articles`, `threads`, `results`, `pages` — src/content_types.py:294-306).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleResponse"
              examples:
