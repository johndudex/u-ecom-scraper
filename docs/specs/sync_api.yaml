openapi: 3.1.0
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"

# =============================================================================
# Universal Ecommerce Scraper — Partner-Facing SYNC API (DRAFT v0.1)
# =============================================================================
# Status: DRAFT for critique round. Not yet implemented. Derived from the live
# codebase on branch file-master-artifacts (evidence cited per-field below as
# file:line). This is a SPEC, not a description of existing endpoints: every
# path here is NEW and lives under /api/v1/*, backed by thin wrappers around
# existing internal logic.
#
# Design notes (full rationale in the accompanying design message):
#
# 1. SYNC-STYLED OVER AN ASYNC CORE. Jobs run 10-60 min. This API exposes the
#    async pipeline as a synchronous-looking resource: create -> poll a 3-state
#    status -> fetch artifacts. No websockets, no SSE here (the AsyncAPI
#    sibling spec owns push/callback delivery; `callback_url` on create is
#    ACCEPTED here but its delivery contract is defined there).
#
# 2. THE 3 STATES AND WHAT ACTUALLY PRODUCES THEM (see JobState description
#    for the full derivation table). Sample readiness is NOT a state — the
#    handler's projection (scraper/api/state.py partner_state) only ever
#    returns inprogress | scraper_ready | failed; "the sample is fetchable"
#    is the separate `sample_available` boolean on the status resource (and
#    the `job.sample_ready` EVENT on the stream — REST and events agree via
#    the m4 state gate):
#      inprogress    — ScrapeJob.status in {pending, running, waiting_approval,
#                      browser_unavailable (PARKED — non-terminal, resumes
#                      when the browser service recovers)}.
#                      sample_available flips true mid-run once testing has
#                      passed and the sample is persisted as structured
#                      records (File Master key
#                      scrapers/{slug}/samples/sample-{job_id}.json — written
#                      by the pipeline's sample-persist step; GET /sample
#                      reads exactly that key).
#      scraper_ready — ScrapeJob.status == completed (terminal success). The
#                      scraper is promoted by cleanup
#                      (webapp/agents/graph.py:973-1018 _promote_scraper; per-job
#                      copy at scrapers/{slug}/jobs/scraper-{job_id}.py +
#                      production scrapers/{slug}/scraper.py on SUCCESS) and the
#                      full output is published by the finalizer
#                      (webapp/scraper/tasks.py:798-819).
#      failed        — ScrapeJob.status in {failed, cancelled, captcha_blocked,
#                      akamai_blocked}. Cancelled/blocked are folded into failed
#                      with a machine-readable `failure.code` (see open
#                      questions if a 5th state is preferred).
#                      browser_unavailable (parked) is NOT failed — see
#                      inprogress above.
#
# 3. MULTI-TENANCY. Every job is scoped to the API key's owning user
#    (ScrapeJob.user, webapp/scraper/models.py:156-159). Cross-tenant reads are
#    404 (not 403) so job ids cannot be enumerated across tenants.
#
# 4. ERROR MODEL. The existing internal convention is JsonResponse with an
#    {"error": "<string>"} body (21 occurrences in webapp/scraper/views.py) and
#    only sometimes a real status code. This API keeps the familiar key names
#    but upgrades to a single structured error object + real HTTP status codes
#    everywhere (401/403/404/409/422/500). See the Error schema.
#
# 5. BIG OUTPUTS. Full outputs reach 26,742 items / 101 MB (ayahealthcare run,
#    scrapers/ayahealthcare-com/output_2026-07-19_201912.json). Endpoint 4 is
#    window-paginated over the item array; a separate /download path streams
#    the raw file. The sample endpoint is never paginated (samples are <= 5
#    records; field_confirmation.py:23 FIELD_CONFIRMATION_SAMPLE_COUNT = 5).
# =============================================================================

info:
  title: Universal Ecommerce Scraper — Partner API
  version: 0.1.0-draft
  summary: Synchronous partner API to create scrape jobs and retrieve samples, full outputs, and generated scraper code.
  description: |
    A partner-facing, sync-styled HTTP JSON API over the scraper pipeline.

    **Model of use**

    1. `POST /api/v1/jobs` with everything the /intake UI takes. You get a
       `job_id` back immediately (HTTP 202).
    2. Poll `GET /api/v1/jobs/{job_id}` until `state` is terminal
       (`scraper_ready` or `failed`). Typical wall-clock: 10-60 minutes.
       While the extractor is being built and validated, `sample_available`
       flips true (the `state` value itself stays `inprogress`) — at that
       point `GET .../sample` returns a small set of extracted records you
       can show a user before the full run completes.
    3. On `scraper_ready`: `GET .../output` (paginated) or
       `GET .../output/download` (raw file) for the full dataset, and
       `GET .../scraper-code` for the generated Python scraper.

    **Guarantees**

    - `scraper_ready` implies the full output and the scraper code are both
      resolvable (with the degenerate exception documented on the state —
      a completed 0-item run still reports `scraper_ready` with
      `item_count: 0`; check `output_available` / `scraper_available` flags).
    - `failed` does NOT imply no data. A run can fail at the full-execution
      stage after the testing stage produced good records; `GET .../sample`
      and `GET .../output` still return whatever exists (else 404).
    - Jobs are private to the API key that created them. Reading another
      tenant's job id returns 404.

    **Callbacks / streaming — out of scope here**

    An optional `callback_url` may be supplied at create time; its delivery
    semantics (retries, signing, payload shape, SSE/WebSocket channels) are
    specified in the companion AsyncAPI document, NOT in this file. This API
    only stores the URL.
  contact:
    name: Scraper Platform Team
  license:
    name: Proprietary
    identifier: LicenseRef-Internal

# Paths are relative to the deployment root. The Django app mounts the scraper
# app at "/" (webapp/config/urls.py), so /api/v1/* is a fresh namespace that
# does not collide with the existing UI routes (webapp/scraper/urls.py).
  x-rate-limits:
    requests: {sustained_per_second: 10, burst: 30, scope: per key, enforced: true}
    field_discovery: {per_minute: 6, concurrent_per_key: 1, scope: per key, enforced: true, over_limit_status: 429, note: POST /api/v1/discover-fields only — one browser render + one LLM pass per call, ~45s wall-clock ceiling}
    event_streams: {concurrent_total: 1, scope: global (all partners share the sync tier's worker budget), enforced: true, over_limit_status: 503, note: raise PARTNER_STREAM_BUDGET or deploy the Phase-12 gateway when a partner needs concurrent streams}
    response: {status: 429, retry_after_header: seconds}
    not_yet_enforced: |
      creates-per-hour and ws-token-per-minute are DESIGN CEILINGS
      recorded for capacity planning, not enforced in v1 — the global
      request limiter (10 rps/key) bounds them indirectly. Enforce
      per-limit if abuse appears.
    fail_open: |
      CAVEAT (honesty): every limiter reads Redis. If Redis is unreachable the
      limiters FAIL OPEN (requests proceed unthrottled) rather than failing
      closed — availability is preferred over enforcement. Durations of
      unthrottled service are expected to be short (Redis is on the same
      deployment), but partners MUST NOT rely on 429s as a backpressure signal.
  x-timeouts:
    # Server-side ceilings a client should budget against (proxy idle timeouts
    # sit below these; a ceiling exceeded = 504/503, never a hang).
    artifact_read: {seconds: 120, applies_to: "GET .../sample, /output (paginated), /scraper-code — File Master read + JSON decode"}
    output_download: {seconds: 30, applies_to: "GET .../output/download — proxy stream start; bytes then flow for the file's duration"}
    field_discovery: {seconds: 45, applies_to: "POST /api/v1/discover-fields — browser render ≤25s + LLM ≤20s (enforced upstream)"}

servers:
  - url: /
    description: Same-origin (Django web app + API). Railway deployment serves this at https://<app>.up.railway.app/.

security:
  - ApiKeyAuth: []

tags:
  - name: jobs
    description: Create, list, inspect, and cancel scrape jobs.
  - name: artifacts
    description: Retrieve job artifacts — sample records, the full scraped output, and the generated scraper code.
  - name: intake-helpers
    description: >-
      Optional pure helpers mirroring the /intake UI's pre-submit checks.
      Recommended ONLY for validate-schema (see its notes). check-site IS
      exposed but deliberately metadata-only — `known_site` true is a bounded
      cross-tenant signal (boolean + platform string; never fields or other
      tenants' data — see design rationale).
  - name: field-discovery
    description: >-
      Live field discovery for a sample item page (wave-41): renders the URL
      in the platform browser (stealth) and extracts candidate fields via an
      LLM pass with a deterministic JSON-LD fallback. Expensive — one browser
      render + one LLM call per request (~45s ceiling); dedicated per-key
      limits apply on top of the global limiter.
  - name: extractors
    description: |
      Reusable extractor configurations (the Site a job runs against), scoped
      to the API key's OWN jobs (distinct Sites whose url matches one of the
      key's ScrapeJobs). PATCH is a strict allowlist; archive/unarchive is the
      removal path — there is NO DELETE by design (hard delete stays a
      superuser UI action).

paths:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. CREATE JOB
  # ─────────────────────────────────────────────────────────────────────────
  /api/v1/check-site:
    post:
      tags: [jobs]
      operationId: checkSite
      summary: Scope-limited site pre-check
      description: |
        SECURITY NOTE: `known_site: true` is an accepted, bounded
        cross-tenant signal — it discloses that *some* tenant scraped this
        host (boolean + platform string only; never fields or outputs).

        Answers "has this site been scraped before" WITHOUT the cross-tenant
        leak that excluded the internal `intake_check_site` (which reads
        every user's target_fields for the host — views.py:2331-2337).
        Returns Site-level metadata only — no field names, no other
        tenants' data. Pure read; no side effects.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  example: "https://www.rmwilliams.com.au/"
      responses:
        "200":
          description: |
            Site knowledge summary (scope-limited). For an UNKNOWN host the
            handler returns exactly `{known_site: false, platform: null}` —
            the four other properties are absent, not null.
          content:
            application/json:
              schema:
                type: object
                required: [known_site]
                description: |
                  Only `known_site` is guaranteed present; the rest appear
                  when a Site record exists.
                properties:
                  known_site:
                    type: boolean
                    description: A Site record exists for this host.
                  platform:
                    type: [string, "null"]
                    description: Detected platform (e.g. "Salesforce Commerce Cloud (Demandware)"), null when unknown.
                    example: "Salesforce Commerce Cloud (Demandware)"
                  site_type:
                    type: [string, "null"]
                    description: |
                      Content domain recorded on the Site (Site.site_type —
                      one of shopping | articles | jobs | forum | general),
                      null when unknown. Named `site_type`, not
                      `content_type`: that is the field the record carries
                      (src/content_types.py maps user-facing page types onto
                      these domains; the API does not expose the finer
                      page-type vocabulary here).
                    example: "shopping"
                  site_name:
                    type: [string, "null"]
                    description: Site display name, null when unknown.
                    example: "R.M.Williams"
                  scraping_method:
                    type: [string, "null"]
                    description: Detected scraping strategy (matches JobStatus.scraping_method), null when unknown.
                    example: "playwright"
                  last_scraped_at:
                    type: [string, "null"]
                    format: date-time
                    description: When the site was last scraped to completion, null when never.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: "Bad `url` — not absolute http(s)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "validation_failed"
                message: "url must be an absolute http(s) URL."

  # ─────────────────────────────────────────────────────────────────────────
  # 1a-2. FIELD DISCOVERY (wave-41) — live probe of a sample item page.
  # ─────────────────────────────────────────────────────────────────────────
  /api/v1/discover-fields:
    post:
      tags: [field-discovery]
      operationId: discoverFields
      summary: Discover extractable fields from a sample item page
      description: |
        Renders `url` in the platform browser (stealth) and returns the
        extractable field names plus a flat JSON schema for them — what the
        Extractor Builder UI shows as "available fields" (title, price,
        availability, currency, ...).

        **Constraints (all enforced, not advisory):**
        - `url` must be an absolute http(s) URL of a SAMPLE ITEM PAGE (one
          product/job/article), not the site homepage — homepage-only URLs
          are rejected with `homepage_url`.
        - The host must be public: literal private/loopback/reserved IPs and
          hostnames resolving to any non-public address are rejected with
          `blocked_host` (the render executes inside the platform network).
        - Budget: 6 requests/min per key AND 1 concurrent request per key.
          Either limit exceeded → 429 with `Retry-After`.
        - Wall-clock ceiling ≈ 45s per call (browser render ≤25s + LLM pass
          ≤20s). Budget client timeouts accordingly.

        **No cross-tenant surface:** the response describes only the page the
        caller supplied. Nothing is persisted; no job is created; no other
        tenant's data is consulted.

        `fields: []` with `source: "none"` is a SUCCESS response — the page
        rendered but nothing extractable was found. Infrastructure failures
        use the error codes listed below instead.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  example: "https://www.example-shop.com/p/merino-polo-123"
      responses:
        "200":
          description: |
            Discovery completed. `fields` may be empty (source "none") when
            nothing could be extracted from the rendered page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverFieldsResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Bad URL — not absolute http(s), homepage-only, or non-public host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                invalid_url:
                  value: {code: "invalid_url", message: "url must be an absolute http(s) URL."}
                homepage_url:
                  value: {code: "homepage_url", message: "url must be a sample item page, not the site homepage."}
                blocked_host:
                  value: {code: "blocked_host", message: "url host is not a public address."}
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: The target page blocked automated access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: {code: "site_blocked", message: "The page blocked automated access (antibot)."}
        "503":
          description: Browser render service unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: {code: "discovery_unavailable", message: "Browser service unreachable."}
        "504":
          description: |
            The BROWSER RENDER exceeded its budget (`discovery_timeout` —
            navigate ≤25 s + 5 s headroom). An LLM pass that overruns or
            yields nothing is NOT a 504: the call returns 200 with
            `source: "none"` and an empty field list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: {code: "discovery_timeout", message: "The page took too long to load."}

  # ─────────────────────────────────────────────────────────────────────────
  # 1b. EXTRACTORS (wave-27 W27-6) — reusable Site configurations, scoped to
  #     the key's own jobs. No DELETE: archive is the removal path.
  # ─────────────────────────────────────────────────────────────────────────
  /api/v1/extractors:
    get:
      tags: [extractors]
      operationId: listExtractors
      summary: List extractor configurations visible to this key
      description: |
        Distinct Site rows whose `url` matches one of THIS key's ScrapeJobs
        (trailing-slash tolerant). Most recently updated first. A site with
        no jobs from this key — including other partners' sites — never
        appears; there is no cross-tenant oracle.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated extractor summaries.
          content:
            application/json:
              schema:
                type: object
                required: [extractors, page, page_size, total_items, total_pages]
                properties:
                  extractors:
                    type: array
                    items: { $ref: "#/components/schemas/ExtractorSummary" }
                  page: { type: integer }
                  page_size: { type: integer }
                  total_items: { type: integer }
                  total_pages: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/extractors/{slug}:
    get:
      tags: [extractors]
      operationId: getExtractor
      summary: Extractor detail (configuration + schema fields)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The extractor's full configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractorDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [extractors]
      operationId: patchExtractor
      summary: Update an extractor's configuration (strict allowlist)
      description: |
        Only `name`, `site_type`, `sample_url`, `currency`, `input_urls`,
        `field_notes` are accepted — anything else is 422 `validation_failed`
        and nothing is applied. `field_notes` entries merge INTO the stored
        schema's `fields[].description` by field name (fields not yet in the
        schema are appended). Validation parity with the UI's SiteForm
        cleaners (URL normalization, JSON-array input_urls, choice site_type).
      security:
        - ApiKeyAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractorPatch" }
      responses:
        "200":
          description: Updated extractor detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractorDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [extractors]
      operationId: deleteExtractor
      summary: "Not allowed (by design)"
      description: |
        Extractors have no partner DELETE: a hard delete is dangerous (the
        Site row is the audit trail for every job and scraper artifact).
        `POST /api/v1/extractors/{slug}/archive` is the removal path; hard
        delete stays a superuser UI action. This operation always answers 405.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "405":
          description: Deliberate — archive instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/extractors/{slug}/archive:
    post:
      tags: [extractors]
      operationId: archiveExtractor
      summary: Soft-remove an extractor (idempotent)
      description: |
        Sets `archived_at`. Archived extractors stay visible in the detail
        response (with `archived_at` set) and their history is intact; new
        jobs against them auto-unarchive the Site when submitted through the
        UI (explicit submission beats a stale archive).
      security:
        - ApiKeyAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Archive state after the call.
          content:
            application/json:
              schema:
                type: object
                required: [slug, archived_at]
                properties:
                  slug: { type: string }
                  archived_at: { type: [string, "null"], format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/extractors/{slug}/unarchive:
    post:
      tags: [extractors]
      operationId: unarchiveExtractor
      summary: Restore an archived extractor (idempotent)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Archive state after the call (`archived_at` null).
          content:
            application/json:
              schema:
                type: object
                required: [slug, archived_at]
                properties:
                  slug: { type: string }
                  archived_at: { type: [string, "null"], format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: Create a scrape job (everything /intake takes)
      description: |
        JSON-body equivalent of the /intake form's create-job endpoint
        (`intake_create_job`, webapp/scraper/views.py:2503-2629). Creates a
        `ScrapeJob` row and dispatches the full LangGraph pipeline via
        Celery (`run_scrape_task`); returns immediately.

        **Field mapping from the /intake multipart form**

        | Form field (multipart string)         | API field (JSON)      | Notes |
        |----------------------------------------|-----------------------|-------|
        | `url`                                  | `url`                 | Same. Required. A sample ITEM page, not a homepage. |
        | `nav_method` = `list`/`listing`/`search` | `input_mode` = `url_list`/`list_page`/`search_term` | The API takes the CANONICAL `input_mode` value stored on ScrapeJob (webapp/scraper/views.py:2223-2227 `_INTAKE_NAV_TO_INPUT_MODE`) instead of the UI radio shorthand. |
        | `content_type`                         | `content_type`        | Content-type registry key (`src/content_types.py:153`), stored as `page_type`. |
        | `target_fields` (comma string)         | `target_fields` (array of strings) | No more comma-splitting. |
        | `schema_text` / `schema_file`          | `schema_text`         | Raw JSON Schema as a string (no multipart file upload in JSON APIs). Re-validated server-side; invalid -> 422. |
        | `scope`                                | `scope`               | `all` / `firstn` / `filter`. |
        | `scope_value`                          | `scope_value`         | String; a number for `firstn`, a filter expression for `filter`. Kept a string to match the CharField (webapp/scraper/models.py:166). |
        | `notes`                                | `notes`               | Free text; surfaced to the analysis agents as advisory hints. |
        | `list_urls` (newline text / file)      | `item_urls` (array)   | Item URLs for `input_mode=url_list`. Persisted to the File Master as `scrapers/{slug}/input_urls.json`. |
        | `listing_urls` (newline text / file)   | `listing_urls` (array)| Listing/category page URLs for `input_mode=list_page`. NOTE: the current backend joins these with newlines into `search_criteria` (views.py:2531-2532); this API accepts an array and performs that join server-side. |
        | `search_keywords`                      | `search_keywords`     | Stored as `search_criteria`. |
        | `search_url`                           | `search_url`          | Search results page URL, distinct from keywords. |
        | (none)                                 | `callback_url`        | NEW, optional. Stored only; delivery is specified in the AsyncAPI sibling document. |
        | (none)                                 | `title`               | NEW, optional display name (ScrapeJob.title exists, webapp/scraper/models.py:153; the UI sets it post-hoc — here it can be set at creation). |

        Behavioral parity with `intake_create_job`: the created job always runs
        with `skip_approvals=true` (unattended — views.py:2585) and
        `full_extraction=false` (sample-first mode — views.py:2584; the full
        scope of the run is governed by `scope`/`scope_value` and the input
        mode). A duplicate submission while a job for the same URL is pending
        or running returns 409 with the existing job's id (views.py:2537-2548).
        The API additionally enforces the same site-level duplicate guard as
        the UI: if any COMPLETED job already exists for the same host
        (team-wide / across tenants), the create is refused with 409
        `site_already_processed` unless the body sets `"force": true`.
        Archived sites are exempt (archive = deliberate allow-re-scrape).

        **Host gate (wave-32):** for `input_mode=list_page`/`search_term`,
        every `listing_urls` entry must sit on the same registrable domain
        as `url`; violations are refused with 422 `host_mismatch` BEFORE any
        job is created (no `force` escape — see the 422 response).
        `search_term` jobs have no URL fields to check and are never gated;
        `url_list` is not gated either (item seeds don't pass through F17).
        A job clean at creation stays clean: restart-time overrides recheck
        only values explicitly posted in that request (UI-side).

        Differences from the UI endpoint, on purpose: no
        `X-Requested-With: XMLHttpRequest` requirement and no CSRF token —
        auth is the `X-API-Key` header, and this namespace is CSRF-exempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
            examples:
              urlListProduct:
                summary: Exact URL list — product fields (rmwilliams-style)
                value:
                  url: "https://www.rmwilliams.com.au/comfort-craftsman-boot-chestnut-yearling-leather.html?lang=en_AU"
                  input_mode: "url_list"
                  content_type: "product"
                  item_urls:
                    - "https://www.rmwilliams.com.au/comfort-craftsman-boot-chestnut-yearling-leather.html?lang=en_AU"
                    - "https://www.rmwilliams.com.au/mulyungarie-quarter-zip-sweatshirt-brushed-back-sweat-pine.html?lang=en_AU"
                  target_fields: ["title", "price", "availability", "currency"]
                  scope: "firstn"
                  scope_value: "10"
                  notes: "Australian retail site; AUD pricing expected."
                  title: "RM Williams — boots + sweatshirts"
              listingPage:
                summary: Listing page discovery
                value:
                  url: "https://www.rmwilliams.com.au/comfort-craftsman-boot-chestnut-yearling-leather.html?lang=en_AU"
                  input_mode: "list_page"
                  content_type: "product"
                  listing_urls:
                    - "https://www.rmwilliams.com.au/footwear/men/chelsea-boots?lang=en_AU"
                    - "https://www.rmwilliams.com.au/clothing/men/sweatshirts?lang=en_AU"
                  target_fields: ["title", "price", "availability", "currency"]
                  scope: "all"
                  title: "RM Williams — chelsea boots + sweatshirts"
              searchWithSchema:
                summary: Search term + JSON Schema + callback
                value:
                  url: "https://www.ayahealthcare.com/travel-nursing/jobs/oral-surgeon-dentist-wisconsin/"
                  input_mode: "search_term"
                  content_type: "job_posting"
                  search_keywords: "oral surgeon"
                  search_url: "https://www.ayahealthcare.com/jobs/search?q=oral+surgeon"
                  target_fields: ["title", "company", "location", "salary", "description"]
                  schema_text: |
                    {
                      "$schema": "https://json-schema.org/draft/2020-12/schema",
                      "type": "object",
                      "properties": {
                        "title": {"type": "string"},
                        "company": {"type": "string"},
                        "location": {"type": "string"},
                        "salary": {"type": "string"},
                        "description": {"type": "string"}
                      },
                      "required": ["title", "location"]
                    }
                  scope: "all"
                  callback_url: "https://partner.example.com/hooks/scraper"
      responses:
        "202":
          description: Job accepted and dispatched. Poll the returned `status_url`.
          headers:
            Location:
              description: Canonical status resource for the created job.
              schema:
                type: string
                format: uri-reference
                example: "/api/v1/jobs/481"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreated"
              example:
                job_id: 481
                state: "inprogress"
                created_at: "2026-08-20T19:10:45Z"
                status_url: "/api/v1/jobs/481"
                sample_url: "/api/v1/jobs/481/sample"
                output_url: "/api/v1/jobs/481/output"
                output_download_url: "/api/v1/jobs/481/output/download"
                scraper_code_url: "/api/v1/jobs/481/scraper-code"
        "400":
          description: |
            Malformed JSON body only (`validation_failed`). There is no
            scheme/format validation of `url` or `item_urls` at create time
            and no required-field 400 — every field/mode requirement the
            handler checks (`url` + `input_mode` present, `item_urls`
            required for url_list, `listing_urls` for list_page,
            `search_criteria` for search_term, `target_fields` shape,
            `schema_text` validity) is a 422 `validation_failed` or
            `schema_invalid` instead (see the 422 response).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "validation_failed"
                message: "Request body is not valid JSON."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "409":
          description: |
            Two refusal tiers. (1) `duplicate_running_job` — a job for this
            URL is already pending or running; the existing job's id is
            returned so the client can resume polling it. `force` never
            bypasses this tier. (2) `site_already_processed` — the site-level
            duplicate guard: at least one COMPLETED job already exists for
            the same host (checked team-wide / across tenants; a re-scrape of
            a finished site). Re-send the identical request with `"force":
            true` to create the job anyway. Archived sites are exempt; failed
            or parked prior attempts are context only and never gate.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      details:
                        type: object
                        properties:
                          existing_job_id:
                            type: integer
                            description: The id of the already-running job (mirrors intake_create_job's 409 payload, views.py:2541-2548).
              examples:
                duplicateRunningJob:
                  summary: A job for this URL is already pending/running (tier 1 — force never bypasses)
                  value:
                    code: "duplicate_running_job"
                    message: "A job for this URL is already running"
                    details:
                      existing_job_id: 479
                siteAlreadyProcessed:
                  summary: The site was already scraped to completion (tier 2 — bypass with force)
                  value:
                    code: "site_already_processed"
                    message: "Site rmwilliams.com.au was already scraped. Re-send with \"force\": true to create a new job."
                    details:
                      site_slug: "rmwilliams-com-au"
                      prior_job_ids: [479]
                      latest_job_id: 479
                      status_url: "/api/v1/jobs/479"
        "422":
          description: |
            Two validation tiers.

            (1) `schema_invalid` — `schema_text` failed validation (gate
            re-run server-side exactly as in views.py:2560-2570). The
            per-issue list is a REDUCED projection: `{code, message}` ONLY
            — no `severity`/`path` here (writers.py:157-163). Use
            /validate-schema for the full SchemaIssue shape.

            (2) `host_mismatch` — wave-32 host gate: for `input_mode`
            `list_page`/`search_term`, every URL in `listing_urls` must sit
            on the same registrable domain as `url` (subdomains and `www.`
            fold to the same registrable; two-part TLDs like `.co.uk` are
            handled). Cross-host listing URLs would be silently dropped by
            the pipeline's F17 seed filter — discovery starves and the job
            burns its whole budget to a writer wall (job 587: a loveamika
            listing on a marimekko job). Refused at the door instead; there
            is no `force` escape (the pipeline drops these URLs regardless,
            so declining is strictly honest — there is nothing to click
            through). The intake UI gate mirrors this for the webapp form.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      details:
                        type: object
                        properties:
                          issues:
                            type: array
                            items:
                              $ref: "#/components/schemas/SchemaIssue"
                          offending_urls:
                            type: array
                            items: { type: string }
                            description: host_mismatch only — every listing URL not on the job's registrable domain, sorted, deduplicated.
              examples:
                schemaInvalid:
                  value:
                    code: "schema_invalid"
                    message: "schema_text failed validation."
                    details:
                      # create's issues are {code, message} only — the
                      # create gate does not attach severity/path.
                      issues:
                        - code: "type_unsupported"
                          message: "Property 'price' declares type 'decimal'; supported types are string|number|integer|boolean"
                hostMismatch:
                  value:
                    code: "host_mismatch"
                    message: "listing_urls must be on marimekko.com — cross-host URLs would be silently dropped by the pipeline."
                    details:
                      offending_urls:
                        - "https://www.loveamika.com/collections/all"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [jobs]
      operationId: listJobs
      summary: List jobs owned by this API key
      description: |
        Recommended addition beyond the 5 required endpoints: partners need to
        enumerate their jobs to re-attach after a crash, reconcile state, or
        build a dashboard. Mirrors `intake_jobs` (views.py:2632-2673) but
        strictly scoped to the key's user (no superuser see-all bypass in the
        API namespace — see security rationale) and returns the derived
        partner `state` on every row.

        ONLY `page`, `page_size`, and `created_since` are supported. The
        handler silently ignores any other query parameter — there is no
        `state` or `input_mode` filter in v1 (filter client-side after
        fetching, or request it as an enhancement).
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - name: created_since
          in: query
          description: Only jobs created at or after this ISO-8601 timestamp (invalid value -> 422 `invalid_created_since`).
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated job summaries, newest first (ScrapeJob.Meta.ordering, models.py:182-183).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
              example:
                jobs:
                  - job_id: 481
                    title: "RM Williams — boots + sweatshirts"
                    state: "scraper_ready"
                    url: "https://www.rmwilliams.com.au/comfort-craftsman-boot-chestnut-yearling-leather.html?lang=en_AU"
                    input_mode: "url_list"
                    content_type: "product"
                    site_name: "R.M.Williams"
                    item_count: 20
                    created_at: "2026-08-20T19:10:45Z"
                    completed_at: "2026-08-20T19:24:49Z"
                  - job_id: 480
                    title: null
                    state: "inprogress"
                    url: "https://www.ayahealthcare.com/travel-nursing/jobs/oral-surgeon-dentist-wisconsin/"
                    input_mode: "search_term"
                    content_type: "job_posting"
                    site_name: "Aya Healthcare"
                    item_count: null
                    created_at: "2026-08-20T18:02:11Z"
                    completed_at: null
                  - job_id: 479
                    title: null
                    state: "failed"
                    failure:
                      code: "captcha_blocked"
                      message: "Captcha detected: hCaptcha. All 7 probe methods returned captcha pages."
                    url: "https://www.example-boutique.com/products/wool-scarf"
                    input_mode: "url_list"
                    content_type: "product"
                    item_count: 0
                    created_at: "2026-08-20T17:40:03Z"
                    completed_at: "2026-08-20T17:41:20Z"
                page: 1
                page_size: 20
                total_items: 3
                total_pages: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "422":
          description: |
            page/page_size out of bounds (same bounds as /output pagination:
            page >= 1, 1 <= page_size <= 100). created_since is ISO-8601;
            unparseable → 422 with code=invalid_created_since. Matches the
            /output endpoint's parameter contract for consistency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "invalid_page"
