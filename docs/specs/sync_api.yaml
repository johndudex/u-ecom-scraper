                        availability: "In Stock"
                        original_price: ""
                        currency: "AUD"
                        url: "https://www.rmwilliams.com.au/comfort-craftsman-boot-chestnut-yearling-leather.html?lang=en_AU"
                        src_url: "https://www.rmwilliams.com.au/footwear/men/chelsea-boots?lang=en_AU"
                        location: ""
                        status_code: 200
                        scraped_at: "2026-08-20T19:27:01.899259+00:00"
                        remarks: ""
                      - id: 2
                        title: "Mulyungarie quarter-zip sweatshirt"
                        price: "$149.00"
                        availability: "In Stock"
                        original_price: ""
                        currency: "AUD"
