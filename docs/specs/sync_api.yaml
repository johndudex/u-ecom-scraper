        "500":
          $ref: "#/components/responses/InternalError"

  # ─────────────────────────────────────────────────────────────────────────
  # 2. STATUS
  # ─────────────────────────────────────────────────────────────────────────
  /api/v1/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/jobId"
    get:
      tags: [jobs]
      operationId: getJobStatus
      summary: Get job status (the 4-state view)
      description: |
        A thin, derived view over `ScrapeJob` + its `Step` rows + artifact
        resolvability. Poll this; everything else keys off `state`.

        **Derivation (authoritative)** — implemented as a pure function of
        `(job.status, steps, artifact resolvability)`:

        | ScrapeJob.status (models.py:99-117)        | Steps / artifacts                                        | Partner `state`  |
        |---------------------------------------------|----------------------------------------------------------|------------------|
        | `pending`                                   | —                                                        | `inprogress`     |
        | `running`                                   | testing step not done, no sample artifact                | `inprogress`     |
        | `running`                                   | sample artifact resolvable (see below)                   | `inprogress` (`sample_available: true`) |
        | `browser_unavailable`                       | PARKED, non-terminal (resumes on browser-service recovery) | `inprogress` |
        | `waiting_approval`                          | — rare but REACHABLE for API jobs: budget-escalation pauses set this status WITHOUT checking `skip_approvals` (services.py:413-451, called unconditionally); the job resumes on its own — mapped to `inprogress` | `inprogress` |
        | `completed`                                 | —                                                        | `scraper_ready`  |
        | `failed`                                    | —                                                        | `failed`         |
        | `cancelled`                                 | —                                                        | `failed` (`failure.code="cancelled"`) |
        | `captcha_blocked`                           | —                                                        | `failed` (`failure.code="captcha_blocked"`) |
        | `akamai_blocked`                            | —                                                        | `failed` (`failure.code="akamai_blocked"`) |

        **"Sample artifact resolvable"** — in implementation order:
        1. A persisted per-job sample file exists in the File Master at
           `scrapers/{slug}/samples/sample-{job_id}.json` (**requires the small
           backend addition described in the header comments** — this is the
           recommended primary signal), OR
        2. `Step(phase="testing").status == "done"` AND
           `scrapers/{slug}/analysis/test_report.json` exists in the File
           Master (published by `_preserve_test_report`,
           webapp/agents/graph.py:586-603). This signal exists TODAY but yields
           coverage statistics only, not records.
        The `testing`-done signal is deterministic: `_notify_phase`
        (webapp/agents/graph.py:870-889) writes Step rows for every node.
        MONOTONICITY (critique round, vector 2a): retry cycles re-fire
        `testing → running → done` on every code_tester loop
        (graph.py:3382/3413 + retry wiring at graph.py:4488-4500), so a
        CURRENT-status check oscillates `sample_available: true → false →
        true`. Derive instead from "a Step(testing) row has EVER been
        completed (`completed_at IS NOT NULL`)" — the gate clamps at the
        first done and never regresses until a terminal state.

        **`scraper_ready` invariants** — `status=completed` is set only by the
        finalizer ladder (webapp/scraper/tasks.py:916-934), after outputs are
        published to the File Master (tasks.py:798-819) and cleanup has
        promoted the scraper (`_promote_scraper`, graph.py:973-1018 — a
        per-job copy at `scrapers/{slug}/jobs/scraper-{job_id}.py` is ALWAYS
        written when a draft exists; the production
        `scrapers/{slug}/scraper.py` is only promoted on
        `execution_status == "SUCCESS"`). Resolvability for the partner
        endpoints follows the existing `scraper_code` view's precedence:
        per-job `job.scraper_file` first, then the site's production scraper
        (views.py:499-522). A completed run that somehow produced neither
        still reports `scraper_ready` but with `scraper_available: false` —
        check the flags rather than assuming.

        **Cross-tenant**: a job id owned by another key returns 404.
      responses:
        "200":
          description: Current job status. `state` is the partner-facing enum; `internal_status` is exposed read-only for support/debugging.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
              examples:
                inprogress:
                  summary: Early — site analysis underway
                  value:
                    job_id: 481
                    state: "inprogress"
                    internal_status: "running"
                    url: "https://www.rmwilliams.com.au/comfort-craftsman-boot-chestnut-yearling-leather.html?lang=en_AU"
                    input_mode: "url_list"
                    content_type: "product"
                    title: "RM Williams — boots + sweatshirts"
                    current_phase: "site_analysis"
                    phases:
                      - {phase: "accessibility_check", status: "done"}
                      - {phase: "site_analysis", status: "running"}
                      - {phase: "code_generation", status: "pending"}
                      - {phase: "testing", status: "pending"}
                      - {phase: "execution", status: "pending"}
                      - {phase: "cleanup", status: "pending"}
                    sample_available: false
                    output_available: false
                    scraper_available: false
                    item_count: null
                    created_at: "2026-08-20T19:10:45Z"
                    started_at: "2026-08-20T19:10:47Z"
                    completed_at: null
                sampleAvailable:
                  summary: Extractor validated; sample records fetchable mid-run
                  value:
                    job_id: 481
                    state: "inprogress"
                    internal_status: "running"
                    url: "https://www.rmwilliams.com.au/comfort-craftsman-boot-chestnut-yearling-leather.html?lang=en_AU"
                    input_mode: "url_list"
                    content_type: "product"
                    title: "RM Williams — boots + sweatshirts"
                    site_name: "R.M.Williams"
                    platform: "Demandware/SFCC"
                    scraping_method: "playwright"
                    current_phase: "execution"
                    phases:
                      - {phase: "accessibility_check", status: "done"}
                      - {phase: "site_analysis", status: "done"}
                      - {phase: "product_analysis", status: "done"}
                      - {phase: "code_generation", status: "done"}
                      - {phase: "testing", status: "done"}
                      - {phase: "execution", status: "running"}
                      - {phase: "cleanup", status: "pending"}
                    sample_available: true
                    output_available: false
                    scraper_available: false
                    item_count: null
                    created_at: "2026-08-20T19:10:45Z"
                    started_at: "2026-08-20T19:10:47Z"
                    completed_at: null
                scraper_ready:
                  summary: Terminal success — everything downloadable
                  value:
                    job_id: 481
                    state: "scraper_ready"
                    internal_status: "completed"
                    url: "https://www.rmwilliams.com.au/comfort-craftsman-boot-chestnut-yearling-leather.html?lang=en_AU"
                    input_mode: "url_list"
                    content_type: "product"
                    title: "RM Williams — boots + sweatshirts"
                    site_name: "R.M.Williams"
                    platform: "Demandware/SFCC"
                    scraping_method: "playwright"
                    current_phase: null
                    phases:
                      - {phase: "accessibility_check", status: "done"}
                      - {phase: "site_analysis", status: "done"}
                      - {phase: "product_analysis", status: "done"}
                      - {phase: "code_generation", status: "done"}
                      - {phase: "testing", status: "done"}
                      - {phase: "execution", status: "done"}
                      - {phase: "cleanup", status: "done"}
                    sample_available: true
                    output_available: true
                    scraper_available: true
                    item_count: 20
                    output_filename: "output_2026-08-20_192449.json"
                    created_at: "2026-08-20T19:10:45Z"
                    started_at: "2026-08-20T19:10:47Z"
                    completed_at: "2026-08-20T19:24:49Z"
                failed:
                  summary: Terminal failure — with a retrievable sample
                  value:
                    job_id: 479
                    state: "failed"
                    internal_status: "failed"
                    url: "https://www.example-boutique.com/products/wool-scarf"
                    input_mode: "url_list"
                    content_type: "product"
                    current_phase: null
                    failure:
                      code: "execution_failed"
                      message: "Scraper exceeded 900s wall-clock"
                    phases:
                      - {phase: "accessibility_check", status: "done"}
                      - {phase: "site_analysis", status: "done"}
                      - {phase: "code_generation", status: "done"}
                      - {phase: "testing", status: "done"}
                      - {phase: "execution", status: "failed"}
                    sample_available: true
                    output_available: false
                    scraper_available: false
                    item_count: 0
                    created_at: "2026-08-20T17:40:03Z"
                    started_at: "2026-08-20T17:40:05Z"
                    completed_at: "2026-08-20T17:41:20Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─────────────────────────────────────────────────────────────────────────
  # 3. SAMPLE RESPONSE
  # ─────────────────────────────────────────────────────────────────────────
  /api/v1/jobs/{job_id}/sample:
    parameters:
      - $ref: "#/components/parameters/jobId"
    get:
      tags: [artifacts]
      operationId: getJobSample
      summary: Get the sample extraction (available before the run completes)
      description: |
        The small, early artifact: up to 5 extracted records produced while the
        extractor was being built and validated (testing phase). Available
        once `sample_available` is true on the status resource (the `state`
        value itself stays `inprogress` mid-run — there is no sample_ready
        state), and best-effort in `failed` (a failed full run may still
        have a perfectly good sample — see the guarantee in the info block).

        MUTABILITY: the sample is written when testing first passes and
        OVERWRITTEN on later retry cycles — availability is monotone (the
        gate never regresses) but the record contents may change between
        fetches while a retry cycle is in flight. Once the job is terminal,
        the sample is frozen.

        **Never paginated.** Samples are capped at
        `FIELD_CONFIRMATION_SAMPLE_COUNT = 5` records
        (webapp/agents/nodes/field_confirmation.py:23) and pruned to the
        requested schema for display (field_confirmation.py:229-237), so the
        payload is a few KB at most.

        **Implementation provenance**: the pipeline persists the sample as
        structured records in the File Master at
        `scrapers/{slug}/samples/sample-{job_id}.json` (written when testing
        first passes); this endpoint reads exactly that key (writers.py). The
        response is the three-key envelope `{job_id, records, record_count}` —
        there is no per-field coverage or state metadata on it (coverage
        details live in the site's preserved `analysis/test_report.json`).
      responses:
        "200":
          description: Sample records — `{job_id, records, record_count}` (the tester's five-record sample verbatim; records carry the job's normal output fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleResponse"
              examples:
                productSample:
                  summary: Product sample (rmwilliams)
                  value:
                    job_id: 481
                    record_count: 5
                    records:
                      - id: 1
                        title: "Craftsman boot"
                        price: "$699.00"
                        availability: "In Stock"
                        original_price: ""
                        currency: "AUD"
                        url: "https://www.rmwilliams.com.au/comfort-craftsman-boot-chestnut-yearling-leather.html?lang=en_AU"
                        src_url: "https://www.rmwilliams.com.au/footwear/men/chelsea-boots?lang=en_AU"
                        location: ""
                        status_code: 200
                        scraped_at: "2026-08-20T19:27:01.899259+00:00"
                        remarks: ""
                      - id: 2
                        title: "Mulyungarie quarter-zip sweatshirt"
                        price: "$149.00"
                        availability: "In Stock"
                        original_price: ""
                        currency: "AUD"
                        url: "https://www.rmwilliams.com.au/mulyungarie-quarter-zip-sweatshirt-brushed-back-sweat-pine.html?lang=en_AU"
                        src_url: "https://www.rmwilliams.com.au/clothing/men/sweatshirts?lang=en_AU"
                        location: ""
                        status_code: 200
                        scraped_at: "2026-08-20T19:27:04.113902+00:00"
                        remarks: ""
                jobSample:
                  summary: Job-posting sample (aya-style)
                  value:
                    job_id: 480
                    record_count: 3
                    records:
                      - title: "Permanent, Oral Surgeon, Dentist"
                        company: ""
                        location: "Milwaukee, Wisconsin"
                        salary: "$500000.00 to $1000000.00 per year"
                        description: "<h2>Oral &amp; Maxillofacial Surgeon</h2><p>Wisconsin | Established Multi-Specialty Group Practice</p>..."
                        url: "https://www.ayahealthcare.com/travel-nursing/jobs/oral-surgeon-dentist-wisconsin/"
                        status_code: 200
                        scraped_at: "2026-08-20T18:19:44.720815+00:00"
                        remarks: ""
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            Either the job does not exist / is not owned by this key
            (`code: "not_found"` — deliberately indistinguishable so job ids
            cannot be enumerated across tenants), or no sample exists yet:
            state `inprogress` before testing passes, or the job is terminal
            without a sample. The not-ready case is fetch-when-available:
            poll status and retry when `sample_available` flips true. (404
            not 409: nothing is wrong with the request and there is no
            conflict to resolve — the resource simply does not exist yet.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                jobMissing:
                  value:
                    code: "not_found"
                    message: "Job 481 does not exist"
                notReady:
                  value:
                    code: "not_ready"
                    message: "Sample not available yet — the extractor is still being built (current phase: code_generation)"
                    details:
                      # CONSTANT HINT (not an estimate — no phase-duration
                      # telemetry exists; clients should treat it as a floor)
                      retry_after_seconds: 60
        "500":
          $ref: "#/components/responses/InternalError"
        # NO 503 here: a File Master failure on the sample read surfaces as
        # 404 not_ready (writers.py) — the sample path never 503s.

  # ─────────────────────────────────────────────────────────────────────────
  # 4. FULL OUTPUT (paginated)
  # ─────────────────────────────────────────────────────────────────────────
  /api/v1/jobs/{job_id}/output:
    parameters:
      - $ref: "#/components/parameters/jobId"
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSizeLarge"
    get:
      tags: [artifacts]
      operationId: getJobOutput
      summary: Get the full scraped output (window-paginated over the item array)
      description: |
        The complete dataset for the job, returned as fixed windows over the
        output file's item array. The underlying file shape is
        `{site, <output_key>: [...items], metadata}` — exactly what the scraper
        writes (verified: scrapers/rmwilliams-com-au/output_2026-08-20_192449.json,
        scrapers/ayahealthcare-com/output_2026-07-19_201912.json). `site` and
        `metadata` are returned on every page (they are small); `items` is the
        requested window.

        **Why pagination is mandatory**: full outputs reach 26,742 items /
        101 MB. A naive GET returning the raw JSON will blow both the HTTP
        timeout and client memory. Defaults keep a page around a few hundred KB
        even for record types with large text fields (e.g. job descriptions).

        **Which file**: this job's own output, resolved with the existing
        precedence — authoritative `job.output_file` (a File Master key) first,
        else the newest `output_*.json` under `scrapers/{slug}/` whose
        timestamp falls inside this job's run window
        (`_resolve_job_output`, webapp/scraper/views.py:914-966). This
        guarantees a partner never receives a previous run's output.

        **NORMATIVE implementation requirement** (critique round — a full
        parse per request has OOM'd 1 GB containers before): the view MUST
        either stream-parse the item array or cache parsed pages keyed by
        file key + mtime; `json.load` of the whole file per request is NOT
        acceptable. A hard page cap (page_size ≤ 500) bounds worst-case
        response size to ≲2 MB.

        Prefer the whole file? Use `GET /api/v1/jobs/{job_id}/output/download`.
      responses:
        "200":
          description: One window of the full output. `total_items` is the authoritative item count; `item_count` on the status resource equals it.
          headers:
            X-Total-Count:
              description: Total items across all pages (convenience mirror of `total_items`).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutputPage"
              example:
                job_id: 481
                state: "scraper_ready"
                output_key: "products"
                output_filename: "output_2026-08-20_192449.json"
                total_items: 27
                page: 1
                page_size: 100
                total_pages: 1
                site:
                  name: "R.M.Williams"
                  url: "https://www.rmwilliams.com.au"
                  platform: "Demandware/SFCC"
                  scraping_method: "playwright"
                  scraped_at: "2026-08-20T19:34:31.007229+00:00"
                metadata:
                  scraping_duration_seconds: 581.29
                  failed_products: 0
                  rate_limit_delay: 2
                items:
                  - id: 1
                    title: "Craftsman boot"
                    price: "$699.00"
                    availability: "In Stock"
                    original_price: ""
                    currency: "AUD"
                    url: "https://www.rmwilliams.com.au/comfort-craftsman-boot-chestnut-yearling-leather.html?lang=en_AU"
                    src_url: "https://www.rmwilliams.com.au/footwear/men/chelsea-boots?lang=en_AU"
                    location: ""
                    status_code: 200
                    scraped_at: "2026-08-20T19:27:01.899259+00:00"
                    remarks: ""
                  - id: 2
                    title: "Mulyungarie quarter-zip sweatshirt"
                    price: "$149.00"
                    availability: "In Stock"
                    original_price: ""
                    currency: "AUD"
                    url: "https://www.rmwilliams.com.au/mulyungarie-quarter-zip-sweatshirt-brushed-back-sweat-pine.html?lang=en_AU"
                    src_url: "https://www.rmwilliams.com.au/clothing/men/sweatshirts?lang=en_AU"
                    location: ""
                    status_code: 200
                    scraped_at: "2026-08-20T19:27:07.221054+00:00"
                    remarks: ""
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutputArtifactNotFound"
        "422":
          description: |
            Page parameters out of range. Codes are `invalid_page` (page >
            total_pages, < 1, or non-integer) and `invalid_page_size`
            (outside [1, 500] — note the paginated-output bound is 500, the
            list endpoint's is 100) — NOT `validation_failed` (wave-41
            audit round 4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidPage:
                  value:
                    code: "invalid_page"
                    message: "page must be <= 1."
                    details:
                      total_pages: 1
                invalidPageSize:
                  value:
                    code: "invalid_page_size"
                    message: "page_size must be in [1, 500]."
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: |
            The File Master read behind the page window failed (fail-fast —
            the worker never hangs on the artifact store). Code is
            `internal_error` with message "Output store unavailable."
            (wave-41 audit round 4: there is no `storage_unavailable` code —
            that value never existed in the handlers). Retry with backoff;
            the job's recorded state is unaffected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "internal_error"
                message: "Output store unavailable."

  /api/v1/jobs/{job_id}/output/download:
    parameters:
      - $ref: "#/components/parameters/jobId"
    get:
      tags: [artifacts]
      operationId: downloadJobOutput
      summary: Download the raw output file
      description: |
        Serves the job's full output JSON with a
        `Content-Disposition: attachment` header, proxying File Master bytes
        so clients never talk to the artifact store directly. Use this (not
        the paginated endpoint) when you want the whole file in one shot or
        need a stable byte-identical artifact for checksumming; use the
        paginated endpoint for interactive UIs.
        NORMATIVE (critique round): the existing internal view
        (`job_output_download`, views.py:607-626) BUFFERS the entire file
        via `artifacts.read()` — unacceptable at 97 MB. This endpoint MUST
        stream via `artifacts.stream_url()` / the File Master's
        `/stream/{key}` (file_master/app.py:113) instead.
      responses:
        "200":
          description: Raw output JSON file.
          headers:
            Content-Disposition:
              description: 'attachment; filename="output_2026-08-20_192449.json"'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: "The scraper's output document — {site, <output_key>: [...items], metadata}. May be tens of MB."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutputArtifactNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        # NO 503: a File Master failure/miss on the download path surfaces
        # as 404 output_not_found (writers.py) — fail-fast, never a hang.

  # ─────────────────────────────────────────────────────────────────────────
  # 5. SCRAPER CODE
  # ─────────────────────────────────────────────────────────────────────────
  /api/v1/jobs/{job_id}/scraper-code:
    parameters:
      - $ref: "#/components/parameters/jobId"
      - name: format
        in: query
        description: "`json` (default) returns metadata + the code as a string; `raw` returns bare `text/x-python` with an attachment header for direct download."
        schema:
          type: string
          enum: [json, raw]
          default: json
    get:
      tags: [artifacts]
      operationId: getJobScraperCode
      summary: Get the generated scraper (Python source)
      description: |
        The Python scraper this job produced: the job's OWN attributed copy
        (`job.scraper_file` — written by `_promote_scraper` at graph time for
        any run that produced a draft, including failed ones; only production
        promotion is success-gated). The handler reads that one key — there is
        no production-scraper fallback in the API namespace (the internal UI
        view has one; the API 404s instead).

        Note: for navigation-style jobs the scraper is self-contained (two
        phases: discovery + extraction) and runnable outside this platform
        with plain Python + the declared strategy's driver.
      responses:
        "200":
          description: Scraper source. With `format=json`, `{code, filename, size_bytes, url}`; with `format=raw`, the file itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScraperCode"
              example:
                filename: "rmwilliams-com-au_scraper.py"
                size_bytes: 14210
                url: "/api/v1/jobs/481/scraper-code"
                code: |
                  #!/usr/bin/env python3
                  """R.M.Williams product scraper (playwright).

                  Generated by the Universal Ecommerce Scraper.
                  Usage: python scraper.py --input input_urls.json --output out.json
                  """
                  import argparse, json, time
                  from datetime import datetime, timezone
                  from playwright.sync_api import sync_playwright
                  ...
            text/x-python:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            Either the job does not exist / is not owned by this key, or this
            job has no attributable scraper file (`code: "not_found"` in both
            cases — deliberately indistinguishable so job ids cannot be
            enumerated across tenants; there is no `not_ready` branch here —
            poll `scraper_available` on GET /jobs/{id} instead).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "not_found"
                message: "No scraper was produced for this job."
        "500":
          $ref: "#/components/responses/InternalError"

  # ─────────────────────────────────────────────────────────────────────────
  # RECOMMENDED EXTRAS
  # ─────────────────────────────────────────────────────────────────────────
  /api/v1/jobs/{job_id}/callback:
    parameters:
      - $ref: "#/components/parameters/jobId"
    get:
      tags: [jobs]
      operationId: getJobCallback
      summary: Read this job's callback registration and delivery health
      description: |
        The read surface for the event API's disable/re-enable policy
        (async_api.yaml "on_exhaustion: disable_callback"): after delivery
        retries are exhausted the callback is marked `disabled` and this
        endpoint is how a partner learns that. Also exposes delivery
        counters for observability. Absent registration → `callback: null`.
      responses:
        "200":
          description: Current callback registration (or null).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [jobs]
      operationId: updateJobCallback
      summary: Update callback URL or re-enable a disabled callback
      description: |
        Re-enable path for the event API's disable-on-exhaustion policy:
        `{"action": "reenable"}` resets the delivery attempt counter and
        clears `disabled_reason` so the next dispatcher sweep resumes
        delivery of PENDING outbox rows (events queue while disabled —
        they are not dropped). Alternatively rotate the registration:
        supply a new `callback_url` (SSRF-validated like create) and/or a
        new `callback_secret` (returned once at registration only; this is
        also the rotation flow). The action is audit-logged under the
        partner's key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallbackUpdate"
            examples:
              reenable:
                value: {action: "reenable"}
              rotate-url:
                value: {action: "rotate", callback_url: "https://ops.partner.example/new-hook"}
              rotate-secret:
                value: {action: "rotate", callback_secret: "<new 32+ char secret>"}
      responses:
        "200":
          description: Updated registration (secret never included).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CallbackStatus"
                  - type: object
                    description: |
                      Unregistered — the handler returns this WRAPPER
                      (`{"callback": null}`, writers.py:429-434), NOT a bare
                      JSON null. Registered jobs get the bare CallbackStatus.
                      Clients must check for the `callback` key.
                    required: [callback]
                    properties:
                      callback:
                        type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Callback already active (nothing to re-enable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "callback_already_active"
                message: "Callback is active; use action=rotate to change it"
        "422":
          description: Validation failed (SSRF-blocked URL, weak secret).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "invalid_callback_url"
                message: "callback_url resolves to a private address"
        "429":
          description: |
            Re-enable cooldown: at most one `action=reenable` per job per
            60 s (the previous re-enable's `callback.reenabled` outbox row
            starts the window). Honor `Retry-After` (60).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "rate_limited"
                message: "Re-enable cooldown: 60 s between attempts."
                details:
                  retry_after: 60
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/jobs/{job_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/jobId"
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a running job
      description: |
        Recommended extra: partners need a stop button. Mirrors `job_cancel`
        (webapp/scraper/views.py:454-473) — sets `status=cancelled`, revokes
        the Celery task, and (via the post_save hook,
        webapp/scraper/models.py:539-558) supersedes any open approvals. After
        cancellation the job reports `state: "failed"` with
        `failure.code: "cancelled"`.
      responses:
        "200":
          description: Job cancelled (or was already terminal — idempotent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job already terminal (completed/failed) and not cancellable. Returns the current status.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      details:
                        type: object
                        properties:
                          state:
                            $ref: "#/components/schemas/JobState"
              example:
                code: "not_cancellable"
                message: "Job 481 already completed"
                details:
                  state: "scraper_ready"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/ws-token:
    post:
      tags: [jobs]
      operationId: createWsToken
      summary: Mint a single-use short-lived token for browser event clients
      description: |
        Browser `EventSource` (SSE) and `WebSocket` cannot set the X-API-Key
        header. A browser client calls this endpoint (server-side or from a
        same-origin page) and receives a token valid for one use within
        300 s, passed as `?token=` on the event stream URL. Tokens are
        single-use (consumed atomically on first successful connect) and
        short-lived; query-param exposure is bounded by the TTL. Rate-limited
        with the global per-key limits (429 with Retry-After).

        The token is KEY-SCOPED, not job-scoped: it works on any stream the
        key may read. Supplying the optional `job_id` body field merely asks
        the server to echo a ready-made `connect_url` for that job's SSE
        stream (404 if the job does not exist / is not yours); WSS clients
        omit it and build `wss://<gateway>/ws/v1/jobs?token=<token>`
        themselves.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                job_id:
                  type: integer
                  description: Optional — echo a ready-made SSE connect_url for this job (ownership-checked).
      responses:
        "201":
          description: Token minted.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_in, connect_url]
                properties:
                  token:
                    type: string
                  expires_in:
                    type: integer
                    example: 300
                  connect_url:
                    type: [string, "null"]
                    description: |
                      Ready-to-use SSE stream URL with the token appended —
                      null when no `job_id` was supplied (the token itself
                      is still valid on any permitted stream, including the
                      WSS gateway).
              examples:
                sse:
                  description: With job_id — ready-to-use SSE URL.
                  value:
                    token: "01J8ZQ9VK7M2X4A6B8C0D1E3F5"
                    expires_in: 300
                    connect_url: "/api/v1/jobs/481/events?token=01J8ZQ9VK7M2X4A6B8C0D1E3F5"
                keyScoped:
                  description: Without job_id — key-scoped token, null URL.
                  value:
                    token: "01J8ZQ9VK7M2X4A6B8C0D1E3F5"
                    expires_in: 300
                    connect_url: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            `job_id` was supplied but no such job exists for this key
            (ownership-checked — a foreign id is indistinguishable from a
            missing one, per the tenancy rule).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "not_found"
                message: "Job 999 does not exist."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/validate-schema:
    post:
      tags: [intake-helpers]
      operationId: validateSchema
      summary: Validate a JSON Schema and derive its field names
      description: |
        Pure function of its input (no DB writes, no site traffic) — the API
        mirror of `intake_validate_schema` (webapp/scraper/views.py:2364-2401)
        over `src/schema_validation.validate_user_schema`. INCLUDE this one:
        partners building submission forms get server-grade validation and the
        derived field list / detected content type for free, and re-submitting
        the same schema to createJob cannot 422.

        Convention (deliberately kept): returns 200 with `valid: false` when
        the schema is invalid — only transport/auth failures are 4xx/5xx.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [schema]
                  properties:
                    schema:
                      type: object
                      description: |
                        The JSON Schema (or the internal `{fields: [...]}` dialect)
                        as a JSON object — the form Extractor Builder sends.
                - type: object
                  required: [schema_text]
                  properties:
                    schema_text:
                      type: string
                      description: "The same schema serialized as a UTF-8 JSON string — the form the /intake UI posts."
                  examples:
                    - |
                      {
                        "schema_text": "{\"type\":\"object\",\"properties\":{\"title\":{\"type\":\"string\"},\"price\":{\"type\":\"string\"},\"availability\":{\"type\":\"string\"}},\"required\":[\"title\",\"price\"]}"
                      }
              description: |
                Exactly one of `schema` (object) or `schema_text` (string).
                The object form is canonical; the string form exists for
                intake-UI parity and is parsed server-side. Supplying both is
                a 400 (ambiguous); neither is a 400.
      responses:
        "200":
          description: Validation result (valid or not).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaValidationResult"
              examples:
                valid:
                  value:
                    valid: true
                    issues: []
                    derived_fields: ["title", "price", "availability"]
                    detected_content_type: "product"
                invalid:
                  value:
                    valid: false
                    issues:
                      - code: "empty_schema"
                        message: "Schema has no properties"
                        severity: "error"
                        path: "$"
                    derived_fields: []
                    detected_content_type: null
        "400":
          description: "Neither `schema` nor `schema_text` supplied, both supplied, or `schema_text` is not valid UTF-8 JSON text. Code: `invalid_request`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "invalid_request"
                message: "Supply either 'schema' (object) or 'schema_text' (string), not both."
        "422":
          description: |
            `schema` was supplied but is not a JSON object/array (code
            `schema_invalid`). NOTE: a schema that PARSES but fails schema
            validation is NOT a 422 — the 200 body carries
            `valid: false` with the issue list; this endpoint is the
            pre-flight check, not a gate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "schema_invalid"
                message: "schema must be a JSON object (the schema document itself)."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

# ───────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ───────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Per-partner API key. Maps 1:1 to a non-superuser Django service-account
        user; that user owns every job the key creates (`ScrapeJob.user`,
        webapp/scraper/models.py:156-159) and is the sole tenancy boundary.
        Keys are stored hashed and looked up by SHA-256; send the raw key in
        this header on every request. No session, no CSRF token, no Bearer
        scheme — a deliberate simplification (no OAuth infrastructure exists in
        this deployment; see design rationale).

        - Missing/unknown key -> 401
        - Valid key, disabled/rotated -> 403
        - CODE-LEVEL MANDATE (critique round): API-key authentication MUST
          REJECT keys whose owner `is_superuser` at auth time with 403 —
          prose alone is not a control (`_get_job`'s bypass,
          views.py:34-39, would otherwise expose every tenant's jobs to an
          admin-owned key). API views must scope by the key's user only
          (`_get_job`, views.py:34-39).

  parameters:
    jobId:
      name: job_id
      in: path
      required: true
      description: Numeric ScrapeJob id (the `job_id` returned by createJob).
      schema:
        type: integer
        minimum: 1
    page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: page_size
      in: query
      description: Items per page (job summaries).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    pageSizeLarge:
      name: page_size
      in: query
      description: |
        Records per page for the output window. Default 100 / max 500 — chosen
        so a page stays under ~2 MB even for record types with large text
        fields (aya-style job descriptions average ~4 KB/record).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

  responses:
    RateLimited:
      description: Rate limit exceeded. Retry-After header present (seconds). Respect it; repeated immediate retries extend the window.
      headers:
        Retry-After:
          description: Seconds until the next request will be accepted.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "rate_limited"
            message: "Per-key rate limit exceeded"
            details:
              limit: "10 req/s (burst 30)"
              stream_limit: 1

    Unauthorized:
      description: Missing or unknown `X-API-Key`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "unauthorized"
            message: "A valid X-API-Key header is required"
    Forbidden:
      description: Key recognized but inactive/revoked, or the endpoint is not enabled for this key's plan.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "forbidden"
            message: "This API key has been revoked"
    NotFound:
      description: |
        Resource does not exist — OR exists but belongs to a different tenant.
        Deliberately indistinguishable so job ids cannot be enumerated across
        tenants.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "not_found"
            message: "Job 481 does not exist"
    ValidationError:
      description: Query-parameter validation failure (pagination on list endpoints).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidPage:
              value:
                code: "invalid_page"
                message: "page must be <= 1."
            invalidPageSize:
              value:
                code: "invalid_page_size"
                message: "page must be >= 1 and page_size in [1, 100]."
            invalidCreatedSince:
              value:
                code: "invalid_created_since"
                message: "created_since must be ISO-8601."
    OutputArtifactNotFound:
      description: |
        Either the job does not exist / is not owned by this key
        (`code: "not_found"` — deliberately indistinguishable so job ids
        cannot be enumerated across tenants), or the job has no resolvable
        output (`code: "output_not_found"` — the run never wrote one, or
        the artifact store missed; there is NO `not_ready` branch on the
        output paths — poll `output_available` on GET /jobs/{id} instead).
        Shared verbatim by GET .../output and GET .../output/download.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            jobMissing:
              value:
                code: "not_found"
                message: "Job 999 does not exist"
            outputMissing:
              value:
                code: "output_not_found"
                message: "No output for this job."
    InternalError:
      description: Unexpected server error. `details.trace_id` correlates with server logs.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "internal_error"
            message: "Unexpected error while reading the output artifact"
            details:
              trace_id: "9f1c2a4e-7d3b-4f8e-b1a0-2c5d6e7f8a9b"

  schemas:
    # ── Enums ──────────────────────────────────────────────────────────────
    JobState:
      type: string
      enum: [inprogress, scraper_ready, failed]
      description: |
        The three partner-facing states, derived (never stored) from
        `ScrapeJob.status` (wave-41 audit round 4: the projection —
        scraper/api/state.py `partner_state` — NEVER returns
        `sample_ready`; an earlier draft of this spec said four states and
        that was fiction). Sample fetchability is the separate
        `sample_available` boolean on the status resource, and the event
        stream's `job.sample_ready` is its push equivalent — that is
        exactly how the REST and event surfaces agree:

        - `inprogress` — accepted; the pipeline is analyzing the site, building
          and validating the extractor. `sample_available` flips true
          mid-run once testing has passed; `GET /sample` then returns
          records while the full run continues.
        - `scraper_ready` — terminal success. Full output and scraper code are
          available. (Invariant: `output_available` and `scraper_available`
          flags are authoritative within this state; `item_count` may be 0.)
          RARE EXCEPTION: the post-graph finalizer can fail a job after the
          scraper was promoted (e.g. output persistence error) — in that case
          the state moves to `failed` WITH `scraper_available`/`output_available`
          still true where artifacts survived. Clients must treat `failed` as
          the authoritative terminal state and not stop listening/polling at
          `scraper_ready`.
        - `failed` — terminal failure. `failure` explains why. Samples (and
          sometimes output) may still be retrievable — check the
          `*_available` flags.

        Internal statuses folded in: `cancelled`, `captcha_blocked`, and
        `akamai_blocked` all map to `failed` with a distinct `failure.code`;
        `waiting_approval` maps to `inprogress` (API jobs run unattended with
        `skip_approvals=true`, so it should not occur — mapped defensively).
        `browser_unavailable` (PARKED — the browser service is down and the
        job resumes automatically when it recovers) maps to `inprogress`,
        NOT `failed`: it is non-terminal and can persist for a long time.
        Implementations that omit this mapping would wrongly snapshot parked
        jobs as failed — the state derivation MUST include it. A parked job
        is distinguishable by `current_phase` staying frozen and no step
        progression; there is no separate partner-facing parked state in v1.
    InputMode:
      type: string
      enum: [url_list, list_page, search_term]
      description: |
        How the target items are found. Canonical values as stored on
        `ScrapeJob.input_mode` (webapp/scraper/models.py:123-127). The /intake
        UI's radio shorthands map as `list`→`url_list`, `listing`→`list_page`,
        `search`→`search_term` (`_INTAKE_NAV_TO_INPUT_MODE`,
        webapp/scraper/views.py:2223-2227).

        REALITY NOTE: `navigation` (agentic browse-and-discover) is currently
        ACCEPTED by createJob's validation (`INPUT_MODES` in
        webapp/scraper/api/writers.py) but is NOT part of the v1 contract —
        no SLA, no documented behavior, subject to removal. Do not ship
        against it. Whether v1 strictly rejects `navigation` (422) or
        documents it is an open product decision.
    ContentType:
      type: string
      enum: [product, article, job_posting, forum_thread, serp, page_content]
      description: |
        Content-type registry key (`CONTENT_TYPES`, src/content_types.py:153).
        Determines the output key (`products`, `articles`, `jobs`, `threads`,
        `results`, `pages`) and the default core fields.
    Scope:
      type: string
      enum: [all, firstn, filter]
      description: |
        How much to extract. `firstn` caps at the integer in `scope_value`
        (passed to the scraper as `--limit`,
        webapp/agents/nodes/run_execution.py:421-432); `filter` uses
        `scope_value` as a match expression (advisory); `all` extracts
        everything reachable.
    FailureCode:
      type: string
      enum:
        - cancelled
        - captcha_blocked
        - akamai_blocked
        - pipeline_failed
        - internal_error
      description: Machine-readable failure classification. `cancelled`/`captcha_blocked`/`akamai_blocked` mirror the internal terminal statuses (models.py:104-106); `pipeline_failed` covers every other pipeline failure (the human-readable stage detail lives in `message`); `internal_error` for unexpected server faults. There is deliberately NO member for `browser_unavailable` — parked jobs are non-terminal (they map to `inprogress`) and never produce a `failure` object.

    # ── Errors ─────────────────────────────────────────────────────────────
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable error code. Registry:
            - Auth/tenancy: `unauthorized`, `forbidden`, `not_found`
            - Availability: `not_ready`, `output_not_found`
              (`storage_unavailable` is NOT a real code — an artifact-store
              outage surfaces as `internal_error` on the paginated output
              endpoint and as the endpoint's 404 elsewhere)
            - Create gates: `duplicate_running_job`, `site_already_processed`,
              `host_mismatch`, `validation_failed`, `schema_invalid`
            - Parameter checks: `not_cancellable`, `invalid_page`,
              `invalid_page_size`, `invalid_created_since`
            - Request shape: `invalid_request` (validate-schema only —
              both or neither of `schema`/`schema_text` supplied, or
              `schema_text` is not valid JSON text)
            - Callbacks: `invalid_callback_url`, `callback_already_active`
            - Limits: `rate_limited`
            - Field discovery (POST /api/v1/discover-fields only):
              `invalid_url`, `homepage_url`, `blocked_host`, `site_blocked`,
              `discovery_unavailable`, `discovery_timeout`
            - Method: `method_not_allowed` (wrong HTTP verb on an extractor
              path — DELETE is not the removal verb; archive instead)
            - Server: `internal_error`

            `host_mismatch` = wave-32 host gate refused cross-host listing
            URLs at create time (POST /api/v1/jobs only; no `force` escape).
          examples: ["not_found"]
        message:
          type: string
          description: Human-readable explanation, safe to show in a partner UI.
          examples: ["Job 481 does not exist"]
        details:
          type: object
          additionalProperties: true
          description: Optional structured context — field lists, issue arrays, current state, retry hints, trace ids.
      description: |
        Single error shape for every non-2xx response. This upgrades the
        codebase's prevailing `JsonResponse({"error": "<string>"}, ...)`
        convention (21 occurrences in webapp/scraper/views.py) with a stable
        `code` for programmatic handling, keeps `message` human-readable, and
        moves issue/field detail into `details` instead of ad-hoc sibling keys.

    # ── Create ─────────────────────────────────────────────────────────────
    CreateJobRequest:
      type: object
      required: [url, input_mode]
      properties:
        url:
          type: string
          format: uri
          maxLength: 1000
          description: A sample ITEM page on the target site (one product / job / article — not the homepage). Used to analyze field structure. Stored as both `url` and `product_url`.
          examples: ["https://www.rmwilliams.com.au/comfort-craftsman-boot-chestnut-yearling-leather.html?lang=en_AU"]
        input_mode:
          $ref: "#/components/schemas/InputMode"
        content_type:
          $ref: "#/components/schemas/ContentType"
          default: product
        item_urls:
          type: array
          items:
            type: string
            format: uri
            maxLength: 1000
          maxItems: 10000
          description: "Required for `input_mode=url_list`: the exact item URLs to extract. Deduplicated server-side; persisted to `scrapers/{slug}/input_urls.json`."
          examples:
            - ["https://www.rmwilliams.com.au/comfort-craftsman-boot-chestnut-yearling-leather.html?lang=en_AU"]
        listing_urls:
          type: array
          items:
            type: string
            format: uri
            maxLength: 1000
          maxItems: 50
          description: "Required for `input_mode=list_page`: listing / category page URLs to discover items from."
        search_keywords:
          type: string
          maxLength: 500
          description: "Required for `input_mode=search_term`: the query. Stored as `search_criteria` and passed to the scraper as `--query`."
        search_url:
          type: string
          format: uri
          maxLength: 1000
          description: "Optional for `input_mode=search_term`: a known search-results page URL. Distinct from `search_keywords` (ScrapeJob.search_url, models.py:173-175)."
        target_fields:
          type: array
          items:
            type: string
          maxItems: 100
          description: |
            Field names to extract, in your preferred order. AUTHORITATIVE for
            the output schema — the finalizer deterministically prunes output
            records to these plus bookkeeping fields (`url`, `src_url`,
            `scraped_at`, `status_code`; src/content_types.py:312). ORDER
            CONTRACT (wave-27): the output record's key order follows
            `target_fields` order first, with bookkeeping keys appended.
            Omit to extract everything the analyzer finds.
          examples:
            - ["title", "price", "availability", "currency"]
        schema_text:
          type: string
          description: |
            Optional raw JSON Schema (standard, or the internal
            `{fields: [...]}` dialect). If present it is validated (invalid →
            422) and the derived field names become the enforced
            `target_fields`; the raw text is stored for re-display.
            Use `/api/v1/validate-schema` first to avoid a 422. Per-field
            `description` strings inside the schema become per-field extraction
            instructions (see `field_instructions`).
        field_instructions:
          type: object
          maxProperties: 100
          additionalProperties:
            type: string
            maxLength: 300
          description: |
            Per-field extraction instructions (wave-27) — `{field_name:
            instruction}`. Each value is capped at 300 chars (longer → 422);
            at most 100 entries. Instructions are injected into the analysis
            and code-generation prompts as a "Field guidance" section, and
            ride the stored schema (`fields[].description`) so re-runs keep
            them. Overrides a `description` of the same field in `schema_text`.
          examples:
            - {"price": "numeric only, no currency symbol", "availability": "use the buy-box status, not the wishlist button"}
        scope:
          $ref: "#/components/schemas/Scope"
          default: all
        scope_value:
          type: string
          maxLength: 200
          description: "`scope=firstn` → an integer as a string (e.g. `\"500\"`); `scope=filter` → a match expression."
          examples: ["500", "in stock only"]
        notes:
          type: string
          maxLength: 4000
          description: Free-text guidance for the analysis agents (advisory).
        dagster_enabled:
          type: boolean
          default: false
          description: |
            Opt-in Dagster conversion. When `true`, the pipeline runs a final
            `dagster_converter` phase that emits a Dagster asset module
            (`{slug}_dagster.py`, downloadable via `artifact_type=dagster_code`).
            Default `false` — the phase is skipped entirely and no Dagster step
            appears in the job's phase list.
        force:
          type: boolean
          default: false
          description: |
            Bypass for the site-level duplicate guard ONLY. When a COMPLETED
            job already exists for the same host (409 `site_already_processed`),
            re-send the identical body with `true` to create the job anyway.
            Never bypasses `duplicate_running_job` (a live job for the same
            URL is refused regardless). Failed/parked prior attempts never
            trigger the guard, and archived sites are exempt, so in those
            cases `force` is a harmless no-op. Must be a JSON boolean — the
            string `"false"` is still truthy-but-wrong and is treated as
            not-forced (`is True` parse).
        title:
          type: string
          maxLength: 200
          description: Optional display name for the job (ScrapeJob.title).
        callback_url:
          type: string
          format: uri
          description: |
            Optional HTTPS endpoint to notify on terminal state transitions.
            Delivery semantics (event types, payload shape, retry policy,
            signature header) are specified in the companion AsyncAPI
            document. VALIDATION (enforced here, at create time, by
            `ssrf.validate_callback_url`): the URL MUST be https on port 443
            ONLY (explicit non-443 ports are rejected — there is no 8443
            allowance), MUST NOT be a literal private/loopback/reserved IP,
            MUST resolve at registration time, and every resolved address
            MUST be public (hostnames with ANY private/loopback/link-local
            record are rejected, as are internal service hostnames —
            browser_service, file-master, postgres, redis,
            \*.railway.internal). Signed POSTs to arbitrary internal targets
            would be an SSRF vector (critique round, vector 3d). Resolution
            is checked at REGISTRATION only — DNS rebinding between
            registration and delivery is out of scope for v1.
        callback_secret:
          type: string
          minLength: 32
          maxLength: 256
          description: |
            Shared secret for HMAC-SHA256 verification of callback
            deliveries. Supplied ONCE at registration; stored raw at rest
            in a column no endpoint, log, or admin view ever serializes
            (HMAC signing needs the raw value on every attempt — hashed
            storage is impossible); NEVER returned by any endpoint. Each
            delivery is signed `X-Scraper-Signature:
            t=<send_time_unix>,v1=<hex hmac_sha256("<t>." + raw_body,
            callback_secret)>` — t is SEND time (re-signed on every retry),
            verifiers should reject |now - t| > 300 s.

    JobCreated:
      type: object
      required: [job_id, state, created_at, status_url]
      properties:
        job_id:
          type: integer
        state:
          $ref: "#/components/schemas/JobState"
        created_at:
          type: string
          format: date-time
        status_url:
          type: string
          description: Relative path — GET this to poll.
          examples: ["/api/v1/jobs/481"]
        sample_url:
          type: string
        output_url:
          type: string
        output_download_url:
          type: string
        scraper_code_url:
          type: string

    # ── Status ─────────────────────────────────────────────────────────────
    PhaseStatus:
      type: string
      enum: [pending, running, done, failed]
      description: Step status (Step.STATUS_CHOICES, webapp/scraper/models.py:212-223).
    Phase:
      type: object
      required: [phase, status]
      properties:
        phase:
          type: string
          enum:
            - accessibility_check
            - site_analysis
            - browser_traverse
            - navigation_skill_review
            - navigation_analysis
            - content_analysis
            - product_analysis
            - scraper_analysis
            - code_generation
            - code_review
            - testing
            - field_confirmation
            - execution
            - cleanup
            - skill_learning
            - dagster_converter
            - store_job_listings
          description: Canonical pipeline phases (Step.PHASE_CHOICES, models.py:225-243; seeded from PIPELINE_PHASES, tasks.py:193-208). code_review is seeded-but-inert (the reviewer node was removed; it stays pending forever — clients must not wait on it).
        status:
          $ref: "#/components/schemas/PhaseStatus"
        started_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    Failure:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/FailureCode"
        message:
          type: string
          description: Operator-grade detail (ScrapeJob.error_message, truncated tail of the exception — models.py:177).

    CallbackStatus:
      type: object
      required: [status, url, created_at]
      properties:
        status:
          type: string
          enum: [active, disabled]
        url:
          type: string
          format: uri
        disabled_reason:
          type: [string, "null"]
          description: e.g. "delivery exhausted after 6 attempts over 7h 1m".
        last_failure:
          type: [string, "null"]
          description: Most recent delivery error summary (truncated).
        delivered_count:
          type: integer
          description: Lifetime count of successfully delivered events.
        pending_count:
          type: integer
          description: Outbox rows waiting (including while disabled — they queue, not drop).
        created_at:
          type: string
          format: date-time
        last_delivered_at:
          type: [string, "null"]
          format: date-time

    CallbackUpdate:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [reenable, rotate]
        callback_url:
          type: string
          format: uri
          maxLength: 1000
          description: Required with action=rotate to change the target URL (SSRF-validated as at create).
        callback_secret:
          type: string
          minLength: 32
          maxLength: 256
          writeOnly: true
          description: Required with action=rotate to change the signing secret. Stored raw at column level, never returned by any endpoint, log, or admin view.

    JobStatus:
      type: object
      required: [job_id, state, url, input_mode, content_type, created_at]
      properties:
        job_id:
          type: integer
        state:
          $ref: "#/components/schemas/JobState"
        internal_status:
          type: [string, "null"]
          enum: [pending, running, waiting_approval, browser_unavailable, completed, failed, cancelled, captcha_blocked, akamai_blocked, null]
          description: |
            Read-only raw ScrapeJob.status for support/debugging. Clients
            should branch on `state`, not this. `browser_unavailable` is the
            parked job (transient; projects to `state: inprogress`).
        url:
          type: string
          format: uri
        input_mode:
          $ref: "#/components/schemas/InputMode"
        content_type:
          $ref: "#/components/schemas/ContentType"
        title:
          type: [string, "null"]
          description: Partner-supplied display name, if any.
        site_name:
          type: [string, "null"]
          description: Resolved site display name (e.g. "R.M.Williams").
        rerun_of:
          type: [integer, "null"]
          description: |
            Id of the CHAIN-ROOT job when this job is a re-run (wave-27
            lineage: `rerun_of` = original job; the immediate parent stays
            queryable via `parent_job` internally). Null for fresh jobs.
            API-created jobs are always fresh today, but pollers should read
            this field uniformly — UI-initiated re-runs of a partner's job
            surface here.
        platform:
          type: [string, "null"]
          description: Detected platform (e.g. "Demandware/SFCC", "Shopify").
        scraping_method:
          type: [string, "null"]
          description: Strategy used (e.g. "playwright", "http_navigation", "internal_api").
        current_phase:
          type: [string, "null"]
          description: |
            The phase currently `running`, else null — including on failed
            jobs (the projection never names the failing phase; find it in
            `phases` by status, or read `failure`).
        phases:
          type: array
          items:
            $ref: "#/components/schemas/Phase"
          description: Canonical-order pipeline steps (subset shown by default; every phase present in the live response).
        sample_available:
          type: boolean
          description: GET /sample will return 200 right now.
        output_available:
          type: boolean
          description: GET /output (and /output/download) will return 200 right now. True for terminal success; occasionally true for `failed` when execution wrote a file before failing the quality gate.
        scraper_available:
          type: boolean
          description: GET /scraper-code will return 200 right now. True once cleanup promoted a draft — including on `failed` runs that produced a working draft.
        item_count:
          type: [integer, "null"]
          description: Final count of successfully extracted records (ScrapeJob.product_count — counted from the output's ground truth, tasks.py:769-783). Null while running.
        output_filename:
          type: [string, "null"]
          description: e.g. "output_2026-08-20_192449.json".
        failure:
          $ref: "#/components/schemas/Failure"
        callback:
          type: ["null", object]
          description: |
            Present when the job was created with a callback registration
            (see the event API spec). Summary only — full delivery health
            via GET /api/v1/jobs/{job_id}/callback. Partners polling the
            sync API learn here whether pushes are flowing: `disabled`
            means events are queueing in the outbox, not arriving.
          properties:
            status:
              type: string
              enum: [active, disabled]
            disabled_reason:
              type: [string, "null"]
            last_failure:
              type: [string, "null"]
            pending_count:
              type: integer
              description: Undelivered outbox events for this job (0 when healthy).
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
          description: |
            NOTE (wave-41 audit round 4): JobStatus does NOT carry
            `duration_seconds`, `output_download_url`, or
            `scraper_code_url` — the handler never returns them. The
            convenience URLs ride ONLY on the create response (JobCreated);
            derive duration from the timestamps here client-side.

    JobSummary:
      type: object
      required: [job_id, state, url, input_mode, content_type, created_at]
      properties:
        job_id:
          type: integer
        title:
          type: [string, "null"]
        state:
          $ref: "#/components/schemas/JobState"
        failure:
          $ref: "#/components/schemas/Failure"
        url:
          type: string
          format: uri
        input_mode:
          $ref: "#/components/schemas/InputMode"
        content_type:
          $ref: "#/components/schemas/ContentType"
        site_name:
          type: [string, "null"]
        rerun_of:
          type: [integer, "null"]
          description: Chain-root job id when this job is a re-run (see JobStatus.rerun_of); null otherwise.
        item_count:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    JobList:
      type: object
      required: [jobs, page, page_size, total_items, total_pages]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobSummary"
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer

    # ── Artifacts ──────────────────────────────────────────────────────────
    OutputKey:
      type: string
      enum: [products, jobs, articles, threads, results, pages]
      description: The JSON key the output stores items under, derived from content type (get_output_key_label, src/content_types.py:294-306).

    ScrapedRecord:
      type: object
      description: |
        One extracted record. The four bookkeeping fields are always present
        (BOOKKEEPING_FIELDS, src/content_types.py:312); every other key comes
        from the requested `target_fields` (or everything found, when no
        schema was requested). KEY ORDER (wave-27): `target_fields` order
        first, bookkeeping appended. Values are strings unless the source
        provided structured types — treat all values as display strings.
      additionalProperties: true
      properties:
        url:
          type: string
          description: Canonical URL of the extracted item.
        src_url:
          type: string
          description: Page the item was discovered on (listing/search page).
        scraped_at:
          type: string
          description: ISO-8601 timestamp of this record's extraction.
        status_code:
          type: integer
          description: HTTP status of the item page fetch (200 = live; 404/410 = dead).
        remarks:
          type: string
          description: Empty on success; soft-404 / diagnostic notes otherwise.
      examples:
        - id: 1
          title: "Craftsman boot"
          price: "$699.00"
          availability: "In Stock"
          original_price: ""
          currency: "AUD"
          url: "https://www.rmwilliams.com.au/comfort-craftsman-boot-chestnut-yearling-leather.html?lang=en_AU"
          src_url: "https://www.rmwilliams.com.au/footwear/men/chelsea-boots?lang=en_AU"
          location: ""
          status_code: 200
          scraped_at: "2026-08-20T19:27:01.899259+00:00"
          remarks: ""

    SiteBlock:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        url:
          type: string
        platform:
          type: string
        scraping_method:
          type: string
        scraped_at:
          type: string
      description: The output file's `site` block, passed through verbatim.

    MetadataBlock:
      type: object
      additionalProperties: true
      properties:
        scraping_duration_seconds:
          type: number
        failed_products:
          type: integer
        rate_limit_delay:
          type: number
      description: The output file's `metadata` block, passed through verbatim.

    SampleResponse:
      type: object
      required: [job_id, records, record_count]
      description: |
        The tester's five-record sample, verbatim (wave-41 audit round 4:
        the handler returns exactly these three keys — no state, output_key,
        or field_coverage envelope; derive progress from
        `sample_available`/`state` on GET /jobs/{id} instead).
      properties:
        job_id:
          type: integer
        records:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ScrapedRecord"
        record_count:
          type: integer
          minimum: 0
          maximum: 5
          description: Number of records in `records`.

    OutputPage:
      type: object
      required: [job_id, state, output_key, output_filename, total_items, page, page_size, total_pages, items]
      properties:
        job_id:
          type: integer
        state:
          type: string
          enum: [scraper_ready, failed]
          description: Terminal state at fetch time (`failed` appears when execution wrote output but the run failed a later gate — output is still served).
        output_key:
          $ref: "#/components/schemas/OutputKey"
        output_filename:
          type: string
        total_items:
          type: integer
          description: Total records across all pages.
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer
        site:
          $ref: "#/components/schemas/SiteBlock"
        metadata:
          $ref: "#/components/schemas/MetadataBlock"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScrapedRecord"

    ScraperCode:
      type: object
      required: [code, filename, size_bytes, url]
      description: |
        The job's attributed scraper copy (`job.scraper_file`), verbatim
        (wave-41 audit round 4: the handler returns exactly these four keys —
        no job_id/state/strategy/source envelope).
      properties:
        code:
          type: string
          description: Full Python source. Typically 200-600 lines.
        filename:
          type: string
          examples: ["rmwilliams-com-au_scraper.py"]
        size_bytes:
          type: integer
          description: Length of `code` in UTF-8 bytes.
        url:
          type: string
          description: Canonical fetch URL for this artifact (this endpoint).

    # ── Schema validation ──────────────────────────────────────────────────
    SchemaIssue:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [error, warning]
        path:
          type: string
          description: JSON-pointer-ish location, e.g. "$.properties.price.type".

    SchemaValidationResult:
      type: object
      required: [valid, issues, derived_fields]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/SchemaIssue"
        derived_fields:
          type: array
          items:
            type: string
          description: Flattened field names the schema requests (these become `target_fields` on create).
        fields:
          type: array
          description: |
            The normalized field list in schema order (wave-27). Bare shape is
            `{name}`; when the schema carries a per-field `description`
            (≤300 chars, longer → `DESCRIPTION_TOO_LONG` warning + truncation)
            the entry grows to `{name, description}`. These descriptions ride
            the job as extraction instructions.
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              description:
                type: string
                maxLength: 300
        detected_content_type:
          description: Content type inferred from the schema's field names; null when not recognizable.
          oneOf:
            - $ref: "#/components/schemas/ContentType"
            - type: "null"

    DiscoverFieldsResponse:
      type: object
      required: [url, fields, source, content_type]
      description: Field candidates for one sample item page (wave-41).
      properties:
        url:
          type: string
          description: Echo of the requested sample item page URL.
        fields:
          type: array
          items: { type: string }
          description: >-
            Candidate extractable field names (snake_case — e.g. title,
            price, availability, currency). Empty when nothing could be
            extracted.
        json_schema:
          type: [object, "null"]
          description: >-
            Flat JSON Schema (type object, one property per field) when a
            schema could be derived; null when `source` is "none".
        source:
          type: string
          enum: [llm, jsonld, none]
          description: >-
            llm = model-extracted from rendered content; jsonld =
            deterministic JSON-LD @type mapping; none = nothing found.
        content_type:
          type: string
          description: >-
            Inferred content type (e.g. "product", "article"); empty string
            when unknown.

    ExtractorSummary:
      type: object
      required: [slug, url, has_scraper, product_count, archived_at]
      properties:
        slug:
          type: string
        name:
          type: [string, "null"]
        url:
          type: string
          format: uri
        site_type:
          description: One of shopping / articles / jobs / forum / general; null when unset.
          oneOf:
            - type: [string, "null"]
        has_scraper:
          type: boolean
        product_count:
          type: integer
        last_scraped_at:
          type: [string, "null"]
          format: date-time
        archived_at:
          type: [string, "null"]
          format: date-time
          description: Non-null = soft-removed (archive); new UI jobs auto-restore.

    ExtractorDetail:
      type: object
      required: [slug, url, has_scraper, product_count, archived_at, fields, input_urls_count]
      allOf:
        - $ref: "#/components/schemas/ExtractorSummary"
        - type: object
          properties:
            platform:
              type: [string, "null"]
            scraping_method:
              type: [string, "null"]
            input_urls_count:
              type: integer
              description: Length of the stored input_urls array (count only — the array itself is create/read via jobs, not echoed here).
            fields:
              type: array
              description: The stored output schema in field order; `description` = per-field extraction instructions (PATCH `field_notes` merges here).
              items:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
                  type:
                    type: [string, "null"]
                  description:
                    type: [string, "null"]

    ExtractorPatch:
      type: object
      description: STRICT allowlist — any other property is 422 validation_failed and nothing is applied.
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        site_type:
          type: string
          enum: [shopping, articles, jobs, forum, general]
        sample_url:
          type: string
          format: uri
        currency:
          type: string
          maxLength: 10
        input_urls:
          type: array
          maxItems: 10000
          items:
            type: string
            format: uri
          description: Replaces the stored input_urls array.
        field_notes:
          type: object
          maxProperties: 100
          additionalProperties:
            type: string
            maxLength: 300
          description: Per-field instructions merged into `fields[].description` by name (unknown field names are appended to the schema).

# ───────────────────────────────────────────────────────────────────────────
# CALLBACKS / WEBSOCKETS — NOT SPECIFIED HERE (by requirement).
# The optional `callback_url` on POST /api/v1/jobs is stored by this API; its
# delivery contract (event names, payloads, retries, signatures, SSE/WSS
# channels) is owned by the sibling AsyncAPI document. This document defines
# no webhooks object and no websocket/bindings on purpose.
# ───────────────────────────────────────────────────────────────────────────
