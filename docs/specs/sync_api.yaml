                      price: {count: 5, coverage: "100%", status: "CORRECT"}
                      availability: {count: 5, coverage: "100%", status: "CORRECT"}
                      currency: {count: 5, coverage: "100%", status: "CORRECT"}
                    generated_at: "2026-08-20T19:22:10Z"
                jobSample:
                  summary: Job-posting sample (aya-style)
                  value:
                    job_id: 480
